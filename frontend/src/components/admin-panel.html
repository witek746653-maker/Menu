<!DOCTYPE html>

<html class="light" lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Админ-панель - Авторизация</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ee6c2b",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Be Vietnam Pro", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex flex-col antialiased overflow-x-hidden transition-colors duration-300">
<!-- Main Container -->
<div class="relative flex flex-1 w-full flex-col justify-center items-center px-4 py-8 sm:px-6 lg:px-8">
<!-- Content Wrapper -->
<div class="w-full max-w-[480px] flex flex-col gap-6">
<!-- Header Section -->
<div class="flex flex-col items-center text-center">
<!-- Logo / Image -->
<div class="mb-6 h-24 w-24 overflow-hidden rounded-full shadow-lg bg-white dark:bg-gray-800 flex items-center justify-center p-1">
<div class="h-full w-full rounded-full overflow-hidden bg-primary/10 flex items-center justify-center relative">
<!-- Using an abstract restaurant/food related image -->
<div class="absolute inset-0 bg-gradient-to-br from-primary/20 to-primary/5"></div>
<span class="material-symbols-outlined text-primary text-4xl relative z-10">restaurant_menu</span>
</div>
</div>
<!-- Headline -->
<h1 class="text-gray-900 dark:text-white tracking-tight text-[32px] font-bold leading-tight px-4 pb-2">
                    Админ-панель
                </h1>
<!-- Subtitle -->
<p class="text-gray-600 dark:text-gray-400 text-base font-normal leading-normal px-4 max-w-xs mx-auto">
                    Управление меню ресторана. Введите данные для входа.
                </p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-5 mt-4" onsubmit="event.preventDefault();">
<!-- Email/Login Input -->
<div class="flex flex-col gap-2">
<label class="text-gray-900 dark:text-gray-200 text-base font-medium leading-normal pl-1">
                        Логин
                    </label>
<div class="relative flex items-center">
<input autocomplete="email" class="form-input flex w-full min-w-0 resize-none overflow-hidden rounded-xl text-gray-900 dark:text-white bg-white dark:bg-[#2f221c] border border-gray-200 dark:border-gray-700 h-14 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal focus:outline-0 focus:ring-1 focus:ring-primary focus:border-primary transition-all duration-200 shadow-sm" placeholder="admin@restaurant.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<label class="text-gray-900 dark:text-gray-200 text-base font-medium leading-normal pl-1">
                        Пароль
                    </label>
<div class="flex w-full items-stretch rounded-xl shadow-sm relative">
<input autocomplete="current-password" class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-gray-900 dark:text-white bg-white dark:bg-[#2f221c] border border-gray-200 dark:border-gray-700 h-14 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-[15px] pr-12 text-base font-normal leading-normal focus:outline-0 focus:ring-1 focus:ring-primary focus:border-primary transition-all duration-200" placeholder="••••••••" type="password"/>
<button class="absolute right-0 top-0 h-full px-4 text-gray-400 hover:text-primary transition-colors flex items-center justify-center cursor-pointer bg-transparent border-none outline-none focus:outline-none" type="button">
<span class="material-symbols-outlined text-[24px]">visibility_off</span>
</button>
</div>
</div>
<!-- Utility Links -->
<div class="flex justify-end px-1">
<a class="text-sm font-medium text-primary hover:text-primary/80 transition-colors" href="#">
                        Забыли пароль?
                    </a>
</div>
<!-- Action Button -->
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-primary hover:bg-primary/90 active:scale-[0.98] transition-all duration-200 text-white text-base font-bold leading-normal tracking-[0.015em] shadow-md mt-2">
<span class="truncate">Войти</span>
</button>
</form>
<!-- Footer help -->
<div class="mt-4 text-center">
<p class="text-gray-400 text-sm">
                    Нужна помощь? <a class="text-primary hover:underline" href="#">Написать в поддержку</a>
</p>
</div>
</div>
</div>
</body></html>
