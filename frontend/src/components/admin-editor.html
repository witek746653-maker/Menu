<!DOCTYPE html>
<html class="light" lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Редактирование блюда</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ee6c2b",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Be Vietnam Pro", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden">
<header class="sticky top-0 z-10 flex items-center justify-between bg-white dark:bg-[#2c2420] p-4 pb-3 shadow-sm dark:border-b dark:border-white/5">
<button class="flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 text-slate-800 dark:text-white transition-colors">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-10">
            Редактирование блюда
        </h2>
</header>
<main class="flex-1 flex flex-col gap-6 p-4 pb-32">
<section class="flex flex-col gap-3">
<div class="group relative w-full aspect-video rounded-xl bg-slate-100 dark:bg-[#2c2420] border-2 border-dashed border-slate-300 dark:border-white/10 overflow-hidden cursor-pointer hover:border-primary transition-colors">
<div class="absolute inset-0 bg-cover bg-center opacity-80 group-hover:opacity-60 transition-opacity" data-alt="Delicious salad bowl with fresh vegetables and dressing" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuB7KPxyvFwVu-BppUS2uWF0_pblAHtJBe43wAFsxCKE7menSUxtXnlY2JuGir_rEvcNzOvIw0pl9o1AF9qKK_qm3xCDCU5sO3SNtO224HkvCiEtjJ-ZQS_JfohE9ZjhyMwl8hF7t-e3Fs3C1d6VftcjL5JAgJA41MSmfsofUqjpPBsRet3-g-9kLq79kUOwKd1T3vYvEhQbuNiYpppeWfBy-8by6s72UMENe3Fj_imHTL5Itt5vj5m4CM8qDY5RcLAj5ZDkP2sxMVoQ');">
</div>
<div class="absolute inset-0 flex flex-col items-center justify-center">
<div class="flex size-12 items-center justify-center rounded-full bg-black/40 text-white backdrop-blur-sm shadow-lg mb-2">
<span class="material-symbols-outlined">photo_camera</span>
</div>
<span class="text-white font-medium drop-shadow-md text-sm">Изменить фото</span>
</div>
</div>
<p class="text-slate-500 dark:text-slate-400 text-sm px-1">Нажмите на фото, чтобы изменить или загрузить новое.</p>
</section>
<section>
<div class="flex w-full p-1 bg-slate-200 dark:bg-[#3a302a] rounded-xl mb-4">
<label class="flex-1 cursor-pointer">
<input checked="" class="peer sr-only" name="lang" type="radio" value="RU"/>
<div class="flex items-center justify-center py-2 rounded-lg text-sm font-bold text-slate-500 dark:text-slate-400 peer-checked:bg-white dark:peer-checked:bg-[#52453e] peer-checked:text-primary peer-checked:shadow-sm transition-all">RU</div>
</label>
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="lang" type="radio" value="EN"/>
<div class="flex items-center justify-center py-2 rounded-lg text-sm font-bold text-slate-500 dark:text-slate-400 peer-checked:bg-white dark:peer-checked:bg-[#52453e] peer-checked:text-primary peer-checked:shadow-sm transition-all">EN</div>
</label>
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="lang" type="radio" value="ES"/>
<div class="flex items-center justify-center py-2 rounded-lg text-sm font-bold text-slate-500 dark:text-slate-400 peer-checked:bg-white dark:peer-checked:bg-[#52453e] peer-checked:text-primary peer-checked:shadow-sm transition-all">ES</div>
</label>
</div>
<div class="space-y-4">
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-white text-sm font-bold">Название блюда</label>
<input class="w-full rounded-xl border-slate-200 dark:border-white/10 bg-white dark:bg-[#2c2420] text-slate-900 dark:text-white placeholder:text-slate-400 focus:border-primary focus:ring-primary dark:focus:border-primary h-12 px-4" placeholder="Введите название" type="text" value="Салат с киноа и авокадо"/>
</div>
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-white text-sm font-bold">Полное описание</label>
<textarea class="w-full rounded-xl border-slate-200 dark:border-white/10 bg-white dark:bg-[#2c2420] text-slate-900 dark:text-white placeholder:text-slate-400 focus:border-primary focus:ring-primary dark:focus:border-primary p-4 min-h-[100px] resize-y" placeholder="Опишите состав и вкус блюда">Легкий и питательный салат с киноа, свежим авокадо, помидорами черри и заправкой из лайма. Идеален для легкого обеда.</textarea>
</div>
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-white text-sm font-bold">Список ингредиентов</label>
<textarea class="w-full rounded-xl border-slate-200 dark:border-white/10 bg-white dark:bg-[#2c2420] text-slate-900 dark:text-white placeholder:text-slate-400 focus:border-primary focus:ring-primary dark:focus:border-primary p-4 min-h-[100px] resize-y" placeholder="Перечислите ингредиенты через запятую">Киноа белая, авокадо хасс, помидоры черри, свежий шпинат, оливковое масло, сок лайма, морская соль, черный перец.</textarea>
</div>
</div>
</section>
<hr class="border-slate-200 dark:border-white/5 my-2"/>
<section class="space-y-6">
<div class="flex flex-col gap-3">
<label class="text-slate-900 dark:text-white text-sm font-bold">Теги</label>
<div class="flex flex-wrap gap-2">
<span class="inline-flex items-center gap-1 px-3 py-1.5 rounded-full bg-primary/10 text-primary text-sm font-medium">
                        Вегетарианское
                        <button class="hover:text-primary-dark"><span class="material-symbols-outlined text-[16px]">close</span></button>
</span>
<span class="inline-flex items-center gap-1 px-3 py-1.5 rounded-full bg-primary/10 text-primary text-sm font-medium">
                        Острое
                        <button class="hover:text-primary-dark"><span class="material-symbols-outlined text-[16px]">close</span></button>
</span>
<span class="inline-flex items-center gap-1 px-3 py-1.5 rounded-full bg-primary/10 text-primary text-sm font-medium">
                        Без глютена
                        <button class="hover:text-primary-dark"><span class="material-symbols-outlined text-[16px]">close</span></button>
</span>
<button class="inline-flex items-center gap-1 px-3 py-1.5 rounded-full border border-dashed border-slate-300 dark:border-white/20 text-slate-500 dark:text-slate-400 text-sm hover:border-primary hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[18px]">add</span>
                        Добавить
                    </button>
</div>
</div>
<div class="flex flex-col gap-3">
<label class="text-slate-900 dark:text-white text-sm font-bold">Аллергены</label>
<div class="grid grid-cols-4 gap-2">
<div class="flex flex-col items-center gap-1">
<button class="size-14 rounded-xl bg-primary text-white shadow-md flex items-center justify-center transition-all">
<span class="material-symbols-outlined">local_pizza</span>
</button>
<span class="text-xs text-primary font-medium text-center">Глютен</span>
</div>
<div class="flex flex-col items-center gap-1 group">
<button class="size-14 rounded-xl bg-white dark:bg-[#2c2420] border border-slate-200 dark:border-white/10 text-slate-400 dark:text-slate-500 flex items-center justify-center transition-all group-hover:border-primary/50">
<span class="material-symbols-outlined">egg</span>
</button>
<span class="text-xs text-slate-500 dark:text-slate-400 text-center">Яйца</span>
</div>
<div class="flex flex-col items-center gap-1 group">
<button class="size-14 rounded-xl bg-white dark:bg-[#2c2420] border border-slate-200 dark:border-white/10 text-slate-400 dark:text-slate-500 flex items-center justify-center transition-all group-hover:border-primary/50">
<span class="material-symbols-outlined">set_meal</span>
</button>
<span class="text-xs text-slate-500 dark:text-slate-400 text-center">Рыба</span>
</div>
<div class="flex flex-col items-center gap-1">
<button class="size-14 rounded-xl bg-primary text-white shadow-md flex items-center justify-center transition-all">
<span class="material-symbols-outlined">grass</span>
</button>
<span class="text-xs text-primary font-medium text-center">Орехи</span>
</div>
</div>
</div>
</section>
</main>
<footer class="fixed bottom-0 left-0 right-0 p-4 bg-white dark:bg-[#2c2420] border-t border-slate-100 dark:border-white/5 z-20 safe-pb">
<div class="flex gap-3 max-w-lg mx-auto">
<button class="flex-1 h-12 rounded-xl border border-slate-200 dark:border-white/20 text-slate-600 dark:text-slate-300 font-bold hover:bg-slate-50 dark:hover:bg-white/5 transition-colors">
                Отмена
            </button>
<button class="flex-1 h-12 rounded-xl bg-primary text-white font-bold shadow-lg shadow-primary/25 hover:bg-primary/90 transition-colors">
                Сохранить
            </button>
</div>
</footer>
</div>
