<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f9f8f2">
  <title>Меню-тренажёр · интервальное повторение</title>
  <style>
  /* ===== Тёплая светлая тема (совпадает с menu-trainer.html) ===== */
  :root {
    --bg: #f9f8f2;
    --panel: #fff9ef;
    --card: #f6efe3;
    --border: #eadbc8;
    --text: #3b2b1f;
    --muted: #7a6a58;
    --accent: #ff8a1f;
    --accent-2: #ffb347;
    --accent-3: #8c5a3c;
    --ok:#2e7d32; --warn:#b26a00; --bad:#b71c1c;
    --radius: 14px;
    --shadow-md: 0 6px 18px rgba(140, 90, 60, .12), 0 1px 3px rgba(60,40,20,.08);
    --shadow-lg: 0 14px 34px rgba(140, 90, 60, .18), 0 4px 10px rgba(60,40,20,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#1a120b; --panel:#22160f; --card:#2b190f; --border:#3a2316;
      --text:#fff9ef; --muted:#c9bca8; --accent:#ff8a1f; --accent-2:#ffd166; --accent-3:#8c5a3c;
      --shadow-md: 0 6px 18px rgba(0,0,0,.25);
      --shadow-lg: 0 12px 28px rgba(0,0,0,.35);
    }
  }

  * { box-sizing: border-box }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.55 Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  a { color: var(--accent); text-decoration: none }
  a:hover { text-decoration: underline }

  .wrap { width: 100%; margin: 0 auto; padding: 18px 20px 40px; max-width: 1180px }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px }
  h1 { margin: 0; font-size: 26px; letter-spacing: .2px; color: var(--accent-3) }
  .muted { color: var(--muted); font-size: 14px }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px }
  .toolbar > * { background: var(--panel); border: 1px solid var(--border); padding: 9px 12px; border-radius: 12px; box-shadow: var(--shadow-md); color: var(--text); }

  button { cursor: pointer; border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 12px; padding: 10px 14px; font-weight: 700; transition: transform .12s ease, box-shadow .2s ease, background .2s ease }
  button.primary { background: linear-gradient(180deg, #ffd79a, #ffb347); border-color: #f0c78d; color: #5a3a1e; box-shadow: var(--shadow-md) }
  button:hover { transform: translateY(-1px) }
  button:active { transform: translateY(0) }
  button:disabled { opacity: .55; cursor: not-allowed }

  select, input[type="search"] { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--panel); color: var(--text); box-shadow: var(--shadow-md) }
  label { font-weight: 700; font-size: 14px; color: var(--accent-3) }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-lg); overflow: hidden; }
  .card header { padding: 14px 16px; background: linear-gradient(90deg, rgba(255,179,71,.12), transparent); border-bottom: 1px solid var(--border) }
  .card-title { font-size: 20px; font-weight: 800; letter-spacing: .2px; color: #5a3a1e; margin: 0 }
  .card-sub { margin: 2px 0 0 0; color: var(--muted); font-size: 14px }
  .card-body { padding: 16px; display: grid; gap: 12px }
  .hint { color: var(--muted); font-size: 14px }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--border); font-size: 13px; margin-right: 6px; margin-bottom: 6px }
  .answer-block { padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel); box-shadow: inset 0 1px 0 rgba(255,255,255,.4) }
  .grid-two { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); align-items: start }

  .stats { display: flex; gap: 12px; flex-wrap: wrap }
  .stat { padding: 10px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--border); box-shadow: var(--shadow-md); min-width: 140px }
  .stat strong { display: block; font-size: 18px; margin-bottom: 2px }

  .spacer { flex: 1 1 auto }

  .rating { display: flex; flex-wrap: wrap; gap: 10px }
  .rating button { min-width: 120px }
  .rating .again { background: #ffe7e4; border-color: #f7c2ba; color: #7a2e1e }
  .rating .hard { background: #fff1dd; border-color: #f0d19a; color: #8c5a3c }
  .rating .good { background: linear-gradient(180deg, #d9f5d2, #8bd17d); border-color: #a4d6a0; color: #0c2f16 }
  .rating .easy { background: linear-gradient(180deg, #cce9ff, #8fc7ff); border-color: #a7d5ff; color: #0d3758 }

  .tags { display: flex; flex-wrap: wrap; gap: 6px }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px }

  .no-data { padding: 14px; border: 1px dashed var(--border); border-radius: 12px; background: var(--panel); color: var(--muted) }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Меню-тренажёр (интервальное повторение)</h1>
        <div class="muted">Учите блюда в интерактивной форме с гибкими режимами.</div>
      </div>
      <button id="resetProgress" aria-label="Сбросить прогресс">Сбросить прогресс</button>
    </header>

    <div class="toolbar">
      <label for="sectionFilter">Раздел</label>
      <select id="sectionFilter"></select>

      <label for="modeSelect">Режим</label>
      <select id="modeSelect">
        <option value="title-desc">Название → описание</option>
        <option value="desc-title">Описание → название</option>
        <option value="title-contains">Название → состав</option>
        <option value="title-allergens">Название → аллергены</option>
      </select>

      <label for="searchInput">Поиск</label>
      <input id="searchInput" type="search" placeholder="Название или тег" />

      <div class="spacer"></div>
      <button id="shuffleBtn" class="primary">Перемешать</button>
    </div>

    <div class="stats" aria-live="polite">
      <div class="stat"><strong id="statDue">0</strong>Карточек к повторению</div>
      <div class="stat"><strong id="statNew">0</strong>Новых карточек</div>
      <div class="stat"><strong id="statLearned">0</strong>Закреплено</div>
    </div>

    <div id="cardContainer" class="card" aria-live="polite" aria-atomic="true" style="margin-top:16px">
      <header>
        <p class="card-title" id="cardTitle">Загрузка...</p>
        <p class="card-sub" id="cardSubtitle"></p>
      </header>
      <div class="card-body">
        <div class="hint" id="questionText">Подготовка карточек...</div>
        <div id="tagsRow" class="badges"></div>

        <div id="answerBlock" class="answer-block" hidden>
          <div id="answerText"></div>
          <div id="extraDetails" class="grid-two" style="margin-top:10px"></div>
        </div>

        <div class="rating">
          <button class="again" data-score="1">Ещё раз</button>
          <button class="hard" data-score="3">Сложно</button>
          <button class="good" data-score="4">Хорошо</button>
          <button class="easy" data-score="5">Легко</button>
          <button id="revealBtn" class="primary" style="margin-left:auto">Показать ответ</button>
        </div>
      </div>
    </div>

    <div class="muted" style="margin-top:10px">Прогресс сохраняется локально (localStorage). Алгоритм — упрощённый SM-2.</div>
  </div>

  <script>
    const DATA_URL = '../data/menu-database.json';
    const STORAGE_KEY = 'menu-srs-progress-v1';
    const state = {
      cards: [],
      queue: [],
      currentIndex: 0,
      mode: 'title-desc',
      filterSection: 'all',
      search: ''
    };

    const ui = {
      sectionFilter: document.getElementById('sectionFilter'),
      modeSelect: document.getElementById('modeSelect'),
      searchInput: document.getElementById('searchInput'),
      shuffleBtn: document.getElementById('shuffleBtn'),
      resetBtn: document.getElementById('resetProgress'),
      statDue: document.getElementById('statDue'),
      statNew: document.getElementById('statNew'),
      statLearned: document.getElementById('statLearned'),
      cardTitle: document.getElementById('cardTitle'),
      cardSubtitle: document.getElementById('cardSubtitle'),
      questionText: document.getElementById('questionText'),
      answerBlock: document.getElementById('answerBlock'),
      answerText: document.getElementById('answerText'),
      extra: document.getElementById('extraDetails'),
      tagsRow: document.getElementById('tagsRow'),
      ratingButtons: [...document.querySelectorAll('.rating button[data-score]')],
      revealBtn: document.getElementById('revealBtn'),
      cardContainer: document.getElementById('cardContainer')
    };

    function loadProgress() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      } catch (e) { return {}; }
    }

    function saveProgress(progress) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
    }

    function normalizeCards(raw) {
      return raw
        .filter(item => item.id && item.title)
        .map(item => ({
          id: item.id,
          title: item.title.trim(),
          description: item.description || '',
          contains: item.contains || '',
          allergens: item.allergens || [],
          tags: item.tags || [],
          section: item.section || 'Без раздела'
        }));
    }

    function buildSections(cards) {
      const sections = Array.from(new Set(cards.map(c => c.section))).sort();
      ui.sectionFilter.innerHTML = '<option value="all">Все разделы</option>' +
        sections.map(s => `<option value="${s}">${s}</option>`).join('');
    }

    function filterCards() {
      const search = state.search.toLowerCase();
      const filtered = state.cards.filter(card => {
        const matchesSection = state.filterSection === 'all' || card.section === state.filterSection;
        const matchesSearch = !search || card.title.toLowerCase().includes(search) || card.tags.some(t => t.toLowerCase().includes(search));
        return matchesSection && matchesSearch;
      });
      return filtered;
    }

    function buildQueue() {
      const progress = loadProgress();
      const now = Date.now();
      const cards = filterCards();
      const due = [];
      const upcoming = [];

      for (const card of cards) {
        const entry = progress[card.id];
        if (!entry) {
          due.push({ card, due: now });
          continue;
        }
        if (entry.due && entry.due <= now) due.push({ card, due: entry.due });
        else upcoming.push({ card, due: entry.due || now });
      }

      due.sort((a,b)=>a.due-b.due);
      upcoming.sort((a,b)=>a.due-b.due);
      state.queue = [...due, ...upcoming].map(item => item.card);
      state.currentIndex = 0;
      updateStats();
      showCard();
    }

    function srsSchedule(cardId, quality) {
      const progress = loadProgress();
      const now = Date.now();
      const day = 86400000;
      const entry = progress[cardId] || { interval: 0, ease: 2.5, repetitions: 0 };

      if (quality < 3) {
        entry.interval = 1;
        entry.repetitions = 0;
      } else {
        entry.repetitions += 1;
        if (entry.repetitions === 1) entry.interval = 1;
        else if (entry.repetitions === 2) entry.interval = 6;
        else entry.interval = Math.round(entry.interval * entry.ease);
        entry.ease = Math.max(1.3, entry.ease + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02)));
      }

      entry.due = now + entry.interval * day;
      progress[cardId] = entry;
      saveProgress(progress);
    }

    function updateStats() {
      const progress = loadProgress();
      const now = Date.now();
      const cards = filterCards();
      let due = 0, learned = 0, fresh = 0;
      for (const card of cards) {
        const entry = progress[card.id];
        if (!entry) { fresh++; continue; }
        if (entry.due <= now) due++;
        if (entry.interval >= 15) learned++;
      }
      ui.statDue.textContent = due;
      ui.statNew.textContent = fresh;
      ui.statLearned.textContent = learned;
    }

    function renderTags(tags) {
      ui.tagsRow.innerHTML = tags.map(tag => `<span class="pill">${tag}</span>`).join('');
      ui.tagsRow.hidden = tags.length === 0;
    }

    function showCard() {
      const card = state.queue[state.currentIndex];
      if (!card) {
        ui.cardTitle.textContent = 'Карточки не найдены';
        ui.cardSubtitle.textContent = '';
        ui.questionText.textContent = 'Попробуйте изменить фильтры или сбросить прогресс.';
        ui.answerBlock.hidden = true;
        ui.ratingButtons.forEach(btn => btn.disabled = true);
        ui.revealBtn.disabled = true;
        return;
      }

      ui.cardTitle.textContent = card.title;
      ui.cardSubtitle.textContent = `${card.section} · ${card.id}`;
      ui.answerBlock.hidden = true;
      ui.revealBtn.disabled = false;
      ui.ratingButtons.forEach(btn => btn.disabled = true);
      renderTags(card.tags || []);

      switch(state.mode) {
        case 'desc-title':
          ui.questionText.innerHTML = card.description || 'Описание отсутствует';
          ui.answerText.textContent = card.title;
          break;
        case 'title-contains':
          ui.questionText.textContent = card.title;
          ui.answerText.innerHTML = card.contains || 'Нет состава';
          break;
        case 'title-allergens':
          ui.questionText.textContent = card.title;
          ui.answerText.textContent = card.allergens?.length ? card.allergens.join(', ') : 'Аллергены не указаны';
          break;
        default:
          ui.questionText.textContent = card.title;
          ui.answerText.textContent = card.description || 'Описание отсутствует';
      }

      ui.extra.innerHTML = `
        <div>
          <strong style="color:var(--accent-3)">Состав/подача</strong>
          <div class="hint">${card.contains || 'Нет данных'}</div>
        </div>
        <div>
          <strong style="color:var(--accent-3)">Аллергены</strong>
          <div class="hint">${card.allergens?.length ? card.allergens.join(', ') : 'Не указаны'}</div>
        </div>
      `;
    }

    function nextCard() {
      state.currentIndex = (state.currentIndex + 1) % state.queue.length;
      showCard();
    }

    async function init() {
      const res = await fetch(DATA_URL);
      const raw = await res.json();
      state.cards = normalizeCards(raw);
      buildSections(state.cards);
      buildQueue();
    }

    ui.modeSelect.addEventListener('change', e => { state.mode = e.target.value; showCard(); });
    ui.sectionFilter.addEventListener('change', e => { state.filterSection = e.target.value; buildQueue(); });
    ui.searchInput.addEventListener('input', e => { state.search = e.target.value; buildQueue(); });
    ui.shuffleBtn.addEventListener('click', () => { state.queue.sort(() => Math.random() - 0.5); state.currentIndex = 0; showCard(); });
    ui.resetBtn.addEventListener('click', () => { if (confirm('Сбросить локальный прогресс?')) { localStorage.removeItem(STORAGE_KEY); buildQueue(); } });

    ui.revealBtn.addEventListener('click', () => {
      ui.answerBlock.hidden = false;
      ui.ratingButtons.forEach(btn => btn.disabled = false);
    });

    ui.ratingButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const card = state.queue[state.currentIndex];
        if (!card) return;
        const score = Number(btn.dataset.score);
        srsSchedule(card.id, score);
        updateStats();
        nextCard();
      });
    });

    init();
  </script>
</body>
</html>
