<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f9f8f2">
  <title>Тренажер официанта</title>
  <style>
  /* ===== SdLV SRS — тёплая светлая тема (мягкие жёлтые/коричневые/оранжевые) ===== */
:root {
  --bg: #f9f8f2;          /* тёплый светлый фон (как на скрине) */
  --panel: #fff9ef;       /* панели/контролы — топлёное молоко */
  --card: #f6efe3;        /* карточки — песочный */
  --border: #eadbc8;      /* мягкая грань без контрастного серого */
  --text: #3b2b1f;        /* тёплый коричневый текст */
  --muted: #7a6a58;       /* приглушённый текст */
  --accent: #ff8a1f;      /* апельсиновый акцент */
  --accent-2: #ffb347;    /* янтарный акцент */
  --accent-3: #8c5a3c;    /* коричный для вторич. элементов */
  --ok:#2e7d32; --warn:#b26a00; --bad:#b71c1c;
  --radius: 14px;
  --shadow-md: 0 6px 18px rgba(140, 90, 60, .12), 0 1px 3px rgba(60,40,20,.08);
  --shadow-lg: 0 14px 34px rgba(140, 90, 60, .18), 0 4px 10px rgba(60,40,20,.10);
}

/* Ночной режим — аккуратный, без неона */
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#1a120b; --panel:#22160f; --card:#2b190f; --border:#3a2316;
    --text:#fff9ef; --muted:#c9bca8; --accent:#ff8a1f; --accent-2:#ffd166; --accent-3:#8c5a3c;
    --shadow-md: 0 6px 18px rgba(0,0,0,.25);
    --shadow-lg: 0 12px 28px rgba(0,0,0,.35);
  }
}

* { box-sizing: border-box }
html, body {
  margin: 0; height: 100%;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.55 Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}

a { color: var(--accent); text-decoration: none }
a:hover { text-decoration: underline }

.wrap {
  max-width: none !important;
  width: 100% !important;
  margin: 0 !important;
  padding: 0 20px !important;
}

header { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 12px }
h1 { margin: 0; font-size: 26px; letter-spacing: .2px; color: var(--accent-3) }

/* Контейнер для заголовка и иконки */
.title-block {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

/* Стилизуем иконку солнца */
.sun-icon {
  width: 48px;
  height: auto;
  margin-top: 4px;
}

.toolbar {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  overflow-x: hidden;
  padding-bottom: 4px;
}
.toolbar > * {
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 9px 12px;
  border-radius: 12px;
  box-shadow: var(--shadow-md);
}

button, select, input[type="file"] { cursor: pointer }
button {
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  border-radius: 12px;
  padding: 10px 14px;
  font-weight: 700;
  transition: transform .12s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease, opacity .2s ease;
}
button.primary {
  background: linear-gradient(180deg, #ffd79a, #ffb347);
  border-color: #f0c78d;
  color: #5a3a1e;
  box-shadow: var(--shadow-md);
}
button.ghost { background: var(--panel) }
button:hover { transform: translateY(-1px) }
button:active { transform: translateY(0) }
button:disabled { opacity: .55; cursor: not-allowed }

.counter { color: var(--muted); font-size: 13px }

.grid { display: grid; grid-template-columns: minmax(0, 1fr) !important; gap: 16px }

.card {
  width: 100% !important;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}

.body, .answer, .desc, .media { max-width: none !important; }

.card header {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(90deg, rgba(255,179,71,.12), transparent);
}
.title { font-weight: 800; letter-spacing: .2px; font-size: 18px; color: #5a3a1e }
.body { padding: 16px; display: grid; gap: 14px }
.desc { color: var(--text); opacity: .98 }

.media {
  display: flex; justify-content: center; align-items: center;
  margin: 0; max-height: 280px; overflow: hidden;
  background: #fffdf7;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.6);
}
.media img {
  max-height: 280px; width: auto; display: block; object-fit: contain;
  border-radius: 10px;
  transition: transform .12s ease;
}
.media img:hover { transform: scale(1.01) }

details {
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 10px 12px;
  border-radius: 12px;
  box-shadow: var(--shadow-md);
}
details summary { cursor: pointer; color: #8c5a3c; font-weight: 700; outline: none }
.answer h4 { margin: 10px 0 6px 0; font-size: 14px; color: var(--accent-3) }
.answer .column-list { display: block !important; }
.answer .column-list .column { width: 100% !important; display: block; }
.answer .column-list .column > * { max-width: 100%; }
.answer figure.image, .answer figure.image img { max-width: 100% !important; height: auto !important; }
.actions {
  display: grid;
  /* Теперь три колонки для трёх оценок */
  grid-template-columns: repeat(3, minmax(0,1fr));
  gap: 10px;
}
.actions button {
  padding: 12px; border-radius: 12px; border: 1px solid var(--border); text-shadow: none
}
.g0 { background:#ffeaea; color:#7a1e1e }
.g1 { background:#fff0e0; color:#7a4a1e }
.g2 { background:#eef7ea; color:#285a2e }
.g3 { background:#eaf1ff; color:#27405b }
.g4 { background:#f2eaff; color:#4a3566 }

.kbd {
  font: 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  background: #fffdf7; border: 1px solid var(--border);
  padding: 1px 6px; border-radius: 6px; color: var(--text)
}

.empty {
  padding: 48px; text-align: center; color: var(--muted);
  border: 1px dashed var(--border); border-radius: 16px; background: var(--panel)
}

/* Скрываем информацию о следующей дате показа карточки */
.due {
  display: none;
}

.footer { margin-top: 12px; color: var(--muted); font-size: 13px }

.hidden { display: none }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.pill {
  padding: 4px 8px; border-radius: 999px;
  border: 1px solid var(--border);
  background: #fffdf7;
  color: #8c5a3c; font-size: 12px;
  box-shadow: var(--shadow-md)
}

/* Стартовое окно */
.backdrop {
  position: fixed; inset: 0;
  background: rgba(60,40,20,.25);
  display: flex; align-items: center; justify-content: center; padding: 16px
}
.modal {
  width: min(680px, 100%);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px; overflow: hidden; box-shadow: var(--shadow-lg)
}
.modal header { padding: 14px 16px; border-bottom: 1px solid var(--border); background: linear-gradient(90deg, rgba(255,209,102,.20), transparent) }
.modal .content { padding: 16px; display: grid; gap: 12px }
.modal .row { display: grid; gap: 8px }
.modal label { font-size: 13px; color: var(--accent-3) }

/* Мобильные улучшения */
@media (max-width: 480px) {
  h1 { font-size: 22px }
  .title { font-size: 17px }
  .body { padding: 14px; gap: 12px }
  .actions { grid-template-columns: repeat(3, minmax(0,1fr)) }
  /* На маленьких экранах элементы тулбара располагаем по строкам */
  .toolbar > * {
    flex: 1 1 100%;
    margin-bottom: 8px;
  }
}

/* Меньше анимаций по запросу */
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important }
}
  
  /* Reduce space below the main header */
  .wrap > header {
    margin-bottom: 8px !important;
  }
  /* Align title block in a row */
  .title-block {
    flex-direction: row !important;
    align-items: center !important;
  }
  /* Enlarge the sun icon */
  .sun-icon {
    width: 90px !important;
    height: auto !important;
    margin-top: 0 !important;
  }
  /* Make toolbar elements closer together */
  .toolbar {
    /* Reduce space between header buttons */
    gap: 2px !important;
    padding-bottom: 0 !important;
  }
  .toolbar > * {
    /* Make buttons more compact */
    padding: 6px 10px !important;
  }
  .allergens{display:grid;gap:6px}
  .allergens-title{font-weight:700;color:var(--accent-3);font-size:13px}
  .allergens-list{display:flex;flex-wrap:wrap;gap:8px 10px}
  .allergen{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--border);
    border-radius:999px;background:#fffdf7;box-shadow:var(--shadow-md);font-size:13px;color:var(--text)}

  .card {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  border-radius: 0 !important;
}

.body {
  width: 100% !important;
  max-width: none !important;
  padding: 0 20px !important;
}

.desc, .answer {
  width: 100% !important;
  max-width: none !important;
}

details.qa {
  width: 100% !important;
}

.media img {
  width: 100% !important;
  height: auto !important;
  object-fit: contain !important;
}
  </style>

</head>

<body>
  

  <div class="backdrop" id="startBackdrop">
    <div class="modal">
      <header><h1>Выбери меню и раздел</h1></header>
  <div class="content">
        <div class="row">
          <label for="menuSelect">Меню</label>
          <select id="menuSelect">
            <option value="" disabled selected>— выбрать меню —</option>
            <option>Основное меню</option>
            <option>Авторские завтраки</option>
            <option>Сезонное меню</option>
            <option>Фестивали</option>
            <option>Детское меню</option>
            <option>Винная карта</option>
            <option>Общие вопросы</option>
            <option>Всё меню</option>
          </select>
        </div>
        <div class="row" id="sectionRow" style="display:none">
          <label for="sectionSelect">Раздел</label>
          <select id="sectionSelect">
            <option value="" disabled selected>— выбрать раздел —</option>
          </select>
        </div>
        <!-- Новый выбор направления тренировки -->
        <div class="row">
          <label for="typeSelect">Направление</label>
          <select id="typeSelect">
            <option value="desc" selected>Красочное описание</option>
            <option value="feat">Особенности и аллергены</option>
            <option value="comp">Состав</option>
            <option value="blindphoto">Слепой тест: по фото</option>
          </select>
        </div>
        <div class="row">
          <button id="startBtn" class="primary" disabled>Начать тренировку</button>
          <span class="muted" id="startHint"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="wrap">
    <header>
      <div class="title-block">
        <!-- Оставляем только иконку для заголовка -->
        <img src="trainer_icon.png" alt="Sun Icon" class="sun-icon" />
      </div>
      <div class="toolbar">
        <span id="currentInfo" class="pill" style="display:none;"></span>
        <!-- Кнопка «Начать тренировку» скрыта, так как запуск теперь происходит автоматически после выбора профиля -->
        <button id="btnStartTraining" class="primary" style="display:none;">Начать тренировку</button>
        <button id="btnFinish" class="ghost">Закончить</button>
        <button id="btnReset" class="ghost">Начать заново</button>
        <button id="btnCardEditor" class="ghost">Редактор карточек</button>
        <span class="counter" id="stats">—</span>
      </div>
    </header>

    <!-- Контейнер для карточек скрыт до запуска тренировки -->
    <div id="stage" class="grid" style="display:none;"></div>

    <!-- Удаляем подсказки о горячих клавишах и сохранении прогресса -->
  </div>

  <template id="cardTpl">
    <div class="card">
      <header class="row">
        <div class="title"></div>
        <span class="pill muted"></span>
        <span class="pill muted due"></span>
      </header>
      <div class="body">
        <p class="desc"></p>
        <figure class="media hidden"><img alt=""></figure>
        <details class="qa">
          <summary>Показать ответ</summary>
          <div class="answer"></div>
        </details>
        <div class="actions">
          <!-- Упрощённая шкала оценок: оставлены только три кнопки -->
          <button data-grade="2" class="g1">Трудно</button>
          <button data-grade="3" class="g2">Повторить</button>
          <button data-grade="5" class="g3">Легко</button>
        </div>
      </div>
    </div>
  </template>

function normalizeAllergensEmoji(arr){
  if (!Array.isArray(arr)) return [];
  return arr
    .map(x => typeof x === 'string' ? x.trim() : (x?.name || '').trim())
    .filter(Boolean)
    .map(name => ({ name, emoji: ALLERGEN_EMOJI[name.toLowerCase()] || "🔸" }));
}

// --------- Util
const today = () => new Date().toISOString().slice(0,10);
const inDays = d => { const dt = new Date(); dt.setDate(dt.getDate()+d); return dt.toISOString().slice(0,10); };
const clamp = (x,min,max)=>Math.max(min,Math.min(max,x));

function menuMatches(cardMenu, chosen){
  if(!chosen || chosen==='Всё меню') return true;
  return cardMenu === chosen || String(cardMenu).startsWith(String(chosen));
}

// --------- Schedule (SM-2 light)
function schedule(cardId, grade){
  const st = db.cards[cardId] || {n:0, ef:2.5, interval:0, due:today(), lapses:0, last:null, deck:'all'};
  const q = Number(grade);
  if(st.n===0){
    // При низкой оценке переносим повтор на следующий день, чтобы дать возможность перейти к другой карточке
    if(q<=2){ st.interval = 0; st.due = inDays(1); }
    else if(q===3){ st.interval = 1; st.due = inDays(1); }
    else if(q===4){ st.interval = 3; st.due = inDays(3); }
    else { st.interval = 5; st.due = inDays(5); }
    st.n = 1;
    st.lastGrade = q;
  }else{
    if(q<=2){ st.lapses += 1; st.interval = 0; st.n = Math.max(1, st.n-1); st.due = inDays(1); }
    else{ st.ef = clamp(st.ef + (0.1 - (5-q)*(0.08 + (5-q)*0.02)), 1.3, 2.8);
      if(st.interval===0) st.interval = 1;
      else if(st.interval===1) st.interval = 6;
      else st.interval = Math.round(st.interval * st.ef);
      st.due = inDays(st.interval); st.n += 1; }
    // Обновляем последнюю оценку для нормальной классификации
    st.lastGrade = q;
  }
  st.last = today(); db.cards[cardId] = st; save(); return st;
  // Nothing below this line in schedule will run due to early return
}

  return t(rec.description) || (extractQA(rec.raw_html || '')?.description || '');

// --------- Parse helpers
function extractQA(html){
  const tmp = document.createElement('div');
  tmp.innerHTML = html || '';

  // Описание (если вдруг размечено классом)
  const description = tmp.querySelector('.description')?.innerHTML?.trim() || '';

  // Вспомогалки
  function collectAfter(node){
    if(!node) return '';
    let out = '';
    for (let n = node.nextSibling; n; n = n.nextSibling){
      if (n.nodeType === Node.ELEMENT_NODE){
        const tag = n.tagName;
        if (/^H[2-6]$/.test(tag)) break;
        if (tag === 'HR') break;
        out += n.outerHTML || '';
      } else if (n.nodeType === Node.TEXT_NODE){
        const t = (n.textContent || '').trim();
        if (t) out += `<p>${t}</p>`;
      }
    }
    return out.trim();
  }
  function findByHeading(prefix){
    const pfx = prefix.toLowerCase();
    const h = [...tmp.querySelectorAll('h2,h3,h4,h5,h6')]
      .find(el => (el.textContent||'').trim().toLowerCase().includes(pfx));
    return collectAfter(h);
  }
  function findByParagraph(prefix){
    const pfx = prefix.toLowerCase();
    const p = [...tmp.querySelectorAll('p,strong,b')]
      .find(el => (el.textContent||'').trim().toLowerCase().startsWith(pfx));
    if (!p) return '';
    const pHtml = (p.innerHTML || '')
      .replace(/^(<strong>|<b>)?\s*состав\s*[:—-]?\s*(<\/strong>|<\/b>)?/i, '')
      .trim();
    let below = '';
    for (let n = p.nextSibling; n; n = n.nextSibling) {
      if (n.nodeType === Node.ELEMENT_NODE){
        const tag = n.tagName;
        if (/^H[2-6]$/.test(tag) || tag === 'HR') break;
        below += n.outerHTML || '';
      } else if (n.nodeType === Node.TEXT_NODE){
        const t = (n.textContent || '').trim();
        if (t) below += `<p>${t}</p>`;
      }
    }
    return [pHtml ? `<p>${pHtml}</p>` : '', below].join('').trim();
  }

  // Особенности
  let featuresHTML = '';
  const featNode = tmp.querySelector('.features-text, .features-list');
  if (featNode) featuresHTML = featNode.outerHTML;
  if (!featuresHTML) featuresHTML = findByHeading('особен');
  if (!featuresHTML) featuresHTML = findByParagraph('особен');

  // Состав
  let compositionTitle = tmp.querySelector('.composition-title')?.textContent || '';
  let compositionHTML  = tmp.querySelector('.composition')?.innerHTML?.trim() || '';
  if (!compositionHTML) {
    compositionHTML = findByHeading('состав') || findByParagraph('состав');
    if (compositionHTML) compositionTitle = 'Состав';
  }

  // Если состав не найден, пробуем забрать хотя бы первый список (даже если особенности уже есть)
  if (!compositionHTML){
    compositionTitle = compositionTitle || 'Состав';
    const list = tmp.querySelector('h2,h3,h4,h5,h6 + ol, h2,h3,h4,h5,h6 + ul, ol, ul');
    compositionHTML = list?.outerHTML || '';
  }

  // Абсолютный фолбэк: если ни особенностей, ни состава не нашли, показываем весь контент
  if (!featuresHTML && !compositionHTML){
    compositionTitle = compositionTitle || 'Состав';
    compositionHTML = tmp.querySelector('ol, ul')?.outerHTML || tmp.innerHTML.trim();
  }

  const answerHTML = [
    featuresHTML ? `<h4>Особенности</h4>${featuresHTML}` : '',
    compositionHTML ? `<h4>${compositionTitle || 'Состав'}</h4>${compositionHTML}` : ''
  ].join('').trim();

  return { description, featuresHTML, compositionHTML, answerHTML };
}


function idFromTitle(t){ return 'id_' + t.toLowerCase().replace(/\s+/g,'_'); }

async function buildTitleToH2Map(){
  // Только для Основного меню
  try{
    const resp = await fetch(MAIN_HTML);
    if(!resp.ok) throw new Error('HTML не найден');
    const text = await resp.text();
    const doc = new DOMParser().parseFromString(text, 'text/html');
    const map = {}; // title -> h2 text
    let currentH2 = null;
    const container = doc.querySelector('.page-body') || doc.body;
    container.querySelectorAll('h2, h3').forEach(el=>{
      if(el.tagName==='H2'){ currentH2 = el.textContent.trim(); }
      if(el.tagName==='H3' && currentH2){
        const t = el.textContent.trim();
        map[t] = currentH2;
      }
    });
    const h2List = [...new Set(Object.values(map))];
    return {map, h2List};
  }catch(e){
    console.warn('Не удалось разобрать osnovnoe-menu.html:', e);
    return {map:{}, h2List:[]};
  }
}

async function loadCards(){
  // 1) грузим JSON
  const resp = await fetch(CARDS_URL);
  if(!resp.ok) throw new Error('Не удалось загрузить cards.json');
  const raw = await resp.json();

  // 2) если есть mdFile — читаем .md и превращаем в HTML
  const withHtml = await Promise.all(raw.map(async (c) => {
    let html = c.raw_html || c.html || '';
    if (!html && c.mdFile) {
      const md = await fetch(c.mdFile).then(r => {
        if(!r.ok) throw new Error('Не найден md: ' + c.mdFile);
        return r.text();
      });
      html = (window.marked ? marked.parse(md) : md.replace(/\n/g,'<br>'));
    }
    return { ...c, html };
  }));

  // 3) карта h2 из основного html (как раньше)
  const {map: titleToH2, h2List} = await buildTitleToH2Map();
  window.__MAIN_H2 = h2List;

  // конвертируем Markdown → HTML, иначе просто <br>
  const mdOrHtml = (v) => {
    const s = (typeof v === 'string' ? v.trim() : '');
    if (!s) return '';
    if (/<[a-z][\s\S]*>/i.test(s)) return s; // уже HTML
    return (window.marked ? marked.parse(s) : s.replace(/\n/g, '<br>'));
  };
  // хелперы
  const textOrEmpty = v => (typeof v === 'string' ? v.trim() : '');
  const htmlOrEmpty = v => textOrEmpty(v);
  const normalizeContains = v =>
    Array.isArray(v) ? v.map(x => String(x).trim()).filter(Boolean).join(', ')
                    : textOrEmpty(v);

// 4) Разбор и сборка карточек
allCards = withHtml.map(c => {
  const qa = extractQA(c.html);
  const title   = c.title || 'Без названия';
  const menu    = c.menu  || 'Основное меню';
  const section = (titleToH2[title] || c.section || '—');

  const hasJsonDesc = !!(c.description && c.description.trim());
  const hasJsonFeat = !!(c.features && c.features.trim());
  const hasJsonComp = !!(c.contains && c.contains.trim?.() || Array.isArray(c.contains) && c.contains.length);
  const hasJsonAnswer = !!(c.answer && c.answer.trim()) || hasJsonFeat || hasJsonComp;

  const desc = hasJsonDesc ? mdOrHtml(c.description) : (qa.description || '');
  const feat = hasJsonFeat ? mdOrHtml(c.features)     : (qa.featuresHTML || '');
  const comp = hasJsonComp
    ? (Array.isArray(c.contains) ? c.contains.map(x=>String(x).trim()).filter(Boolean).join(', ') : mdOrHtml(c.contains))
    : (qa.compositionHTML || '');

  const answer = (c.answer && c.answer.trim())
    ? mdOrHtml(c.answer)
    : ((feat || comp)
        ? `${feat ? `<h4>Особенности</h4>${feat}` : ''}${comp ? `<h4>Состав</h4>${comp}` : ''}`
        : (qa.answerHTML || ''));

  return {
    id: c.id || idFromTitle(title),
    title, html: c.html,
    imageSrc: (c.image && c.image.src) ? c.image.src : (c.imageSrc || null),
    menu, section,
    desc, feat, comp, answer,
    allergens: Array.isArray(c.allergens) ? c.allergens : [],
    jsonHas: { desc: hasJsonDesc, feat: hasJsonFeat, comp: hasJsonComp, answer: hasJsonAnswer }
  };
});

  // 5) инициализация прогресса
  for(const c of allCards){
    if(!db.cards[c.id]) db.cards[c.id] = {n:0, ef:2.5, interval:0, due:today(), lapses:0, last:null, deck:c.section, lastGrade:2};
  }
  save();
  queueDirty = true;
}


function buildFilter(){
  const sel = document.getElementById('deckFilter');
  sel.innerHTML = '<option value="all">Все разделы</option>';
  const sections = Array.from(new Set(allCards
    .filter(c=>menuMatches(c.menu, profile.menu))
    .map(c=>c.section || '—'))).sort();
  for(const s of sections){
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = s;
    sel.appendChild(opt);
  }
  sel.addEventListener('change', refresh);
  if(profile.section){ sel.value = profile.section; }
}

function isMissingInJSON(c){
  const m = profile.trainingType; // 'desc' | 'feat' | 'comp' | 'answer' | 'blindphoto'
  const h = c.jsonHas || {};
  const nonEmpty = s => typeof s === 'string' && s.trim().length > 0;

  if (m === 'desc')   return !h.desc;
  if (m === 'feat')   return !h.feat;
  if (m === 'comp')   return !h.comp;
  if (m === 'answer') return !h.answer;

  // Режим "Слепой тест: по фото"
  if (m === 'blindphoto') {
    // 1) Есть ли реальное изображение (не важно, вручную задано или авто-подставлено)
    const hasRealImage = !!c.imageSrc;

    // 2) Есть ли ХОТЬ КАКИЕ-ТО данные для ответа
    //    — берем как уже подготовленные поля карточки, так и то, что можно вытащить из raw_html
    const qa = extractQA(c.html);
    const hasAnyAnswer =
      nonEmpty(c.desc) ||
      nonEmpty(c.feat) ||
      nonEmpty(c.comp) ||
      nonEmpty(c.answer) ||
      nonEmpty(qa?.answerHTML) ||
      nonEmpty(qa?.compositionHTML) ||
      nonEmpty(qa?.featuresHTML);

    // Карточка НЕ подходит, если нет фото или нет вообще никакого контента
    return !(hasRealImage && hasAnyAnswer);
  }

  return false;
}



function computeQueue(force = false){
  if(!force && !queueDirty) return;
    const t = today();
    const due = [], newer = [];
  for (const c of allCards){
    if(!menuMatches(c.menu, profile.menu)) continue;
    if(profile.section && c.section !== profile.section) continue;

    // ключевая строка: пропустить, если поле пусто в JSON
    if (isMissingInJSON(c)) continue;

    const st = db.cards[c.id];
    if(!st || st.n === 0) newer.push(c.id);
    else if (st.due <= t) due.push(c.id);
  }
  // Всегда возвращаем просроченные и новые
  queue = [...due, ...newer];
  // Перемешиваем очередь, чтобы карточки показывались в случайном порядке
  for (let i = queue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = queue[i];
    queue[i] = queue[j];
    queue[j] = tmp;
  }
  queueDirty = false;
}

function randomIntInclusive(min, max){
  const lo = Math.ceil(min);
  const hi = Math.floor(max);
  if (hi <= lo) return Math.min(lo, hi);
  return Math.floor(Math.random() * (hi - lo + 1)) + lo;
}

function pickReinsertIndex(minGap, maxGap){
  if (queue.length === 0) return 0;
  const min = Math.min(minGap, queue.length);
  const max = Math.min(Math.max(min, maxGap), queue.length);
  if (max <= min) return min;
  return randomIntInclusive(min, max);
}

function handleGrade(cardId, gradeValue){
  const grade = Number(gradeValue);
  schedule(cardId, grade);
  queue = queue.filter(id => id !== cardId);

  if (grade <= 3) {
    const [minGap, maxGap] = grade <= 2 ? [2, 7] : [5, 10];
    const insertAt = pickReinsertIndex(minGap, maxGap);
    queue.splice(insertAt, 0, cardId);
  }

  if (queue.length === 0) {
    queueDirty = true;
  }

  render();
}

function render(){
  const stage = document.getElementById('stage');
  // Если тренировка не началась, ничего не показываем
  if(!trainingStarted){
    return;
  }
  stage.innerHTML = '';
  computeQueue();
  document.getElementById('stats').textContent = statLine();
  if(queue.length === 0){
    const div = document.createElement('div');
    div.className = 'empty';
    div.innerHTML = 'Нет карточек в очереди. Добавьте карточки или завершите тренировку.';
    stage.appendChild(div);
    return;
  }
  const id = queue[0];
  const c = allCards.find(x=>x.id === id);
  stage.appendChild(renderCard(c));
}

function statLine(){
  const labelByMode = {
    desc:   'описания',
    feat:   'особенностей',
    comp:   'состава',
    answer: 'ответа'
  };
  let total = 0, hard = 0, norm = 0, easy = 0, skipped = 0;

  for (const c of allCards){
    if(!menuMatches(c.menu, profile.menu)) continue;
    if(profile.section && c.section !== profile.section) continue;

    if (isMissingInJSON(c)) { skipped++; continue; }

    total++;
    const st = db.cards[c.id];
    if(!st || st.n === 0) { hard++; continue; }
    const g = st.lastGrade;
    if (g <= 2) hard++;
    else if (g === 3) norm++;
    else easy++;
  }

  const missLabel = labelByMode[profile.trainingType] || 'данных';
  return `Общее: ${total} • Трудно: ${hard} • Норм: ${norm} • Легко: ${easy} • Без ${missLabel}: ${skipped}`;
}


function renderCard(c){
  const tpl = document.getElementById('cardTpl');
  const node = tpl.content.cloneNode(true);
  const st = db.cards[c.id] || {};
  node.querySelector('.title').textContent = c.title;
  node.querySelector('.row .pill').textContent = c.section || 'Раздел';
  node.querySelector('.due').textContent = st.due ? `следующая: ${st.due}` : 'новая';
  const descEl = node.querySelector('.desc');
  const details = node.querySelector('details.qa');
  const answerDiv = node.querySelector('.answer');

  // В зависимости от выбранного направления тренировки показываем разные блоки.
  // Мы всегда скрываем элемент описания и используем блок ответа в details для показа выбранного контента.
  // Summary "Показать ответ" остаётся неизменной.
  descEl.style.display = 'none';
  details.style.display = '';
  function firstNonEmpty(...vals) {
  return vals.find(v => typeof v === 'string' && v.trim());
}
  if(profile.trainingType === 'desc'){
    // Красочное описание
    answerDiv.innerHTML = c.desc || '<em>Нет описания</em>';
  } else if(profile.trainingType === 'feat'){
    // Особенности
    answerDiv.innerHTML = c.feat || '<em>Нет особенностей</em>';
  // ← ДОБАВЬ: чипы аллергенов только в режиме "Особенности"
  const allergens = normalizeAllergensEmoji(c.allergens || []);
  if (allergens.length){
    const wrap = document.createElement('div');
    wrap.className = 'allergens';
    const title = document.createElement('div');
    title.className = 'allergens-title';
    title.textContent = 'Обратить внимание на:';
    const list = document.createElement('div');
    list.className = 'allergens-list';
    allergens.forEach(({name, emoji}) => {
      const item = document.createElement('div');
      item.className = 'allergen';
      const mark = document.createElement('span'); mark.textContent = emoji;
      const label = document.createElement('span'); label.textContent = name;
      item.append(mark, label);
      list.appendChild(item);
    });
    wrap.append(title, list);
    // ключевое: внутрь ответа, а не в .body
    answerDiv.appendChild(wrap);
  }
  } else if (profile.trainingType === 'blindphoto') {
  // До клика: только фото, шапку скрываем
  descEl.style.display = 'none';
  details.style.display = '';
  const cardHeaderEl = node.querySelector('.card > header');
  if (cardHeaderEl) cardHeaderEl.style.display = 'none';

  const sum = details.querySelector('summary');
  if (sum) sum.textContent = 'Показать название, описание, особенности и состав';

  const parts = [];

  if (c.title && c.title.trim()) parts.push(`<h3 style="margin:0 0 8px 0">${c.title}</h3>`);
  if (c.section && c.section.trim())
    parts.push(`<div class="pill" style="display:inline-block;margin-bottom:8px">${c.section}</div>`);
  if (c.desc && c.desc.trim()) parts.push(`<h4>Описание</h4>${c.desc}`);
  if (c.feat && c.feat.trim()) parts.push(`<h4>Особенности</h4>${c.feat}`);

  const allergens = normalizeAllergensEmoji(c.allergens || []);
  if (allergens.length){
    parts.push(`<div class="allergens">
      <div class="allergens-title">Обратить внимание на:</div>
      <div class="allergens-list">
        ${allergens.map(a=>`<div class="allergen"><span>${a.emoji}</span><span>${a.name}</span></div>`).join('')}
      </div></div>`);
  }

  const compHTML = firstNonEmpty(c.comp, extractQA(c.html).compositionHTML, '');
  if (compHTML) parts.push(`<h4>Состав</h4>${compHTML}`);

  answerDiv.innerHTML = parts.join('') || '<em>Нет данных для ответа</em>';

  } else if (profile.trainingType === 'comp') {
    answerDiv.innerHTML = firstNonEmpty(c.comp, extractQA(c.html).compositionHTML, '<em>Нет информации о составе</em>');
  } else {
    answerDiv.innerHTML = firstNonEmpty(c.answer, extractQA(c.html).answerHTML, '<em>Нет данных</em>');
  }
  const media = node.querySelector('.media');
  const img = media.querySelector('img');
  if (c.imageSrc) {
    // Попробуем загрузить изображение из карточки.
    // Если изображение недоступно (например, файл отсутствует), выводим заглушку.
    img.onerror = () => {
      // на случай, если назначенное изображение не существует, показываем дефолтный плейсхолдер
      img.onerror = null; // чтобы избежать бесконечного цикла в случае, если плейсхолдер тоже не загрузится
      img.src = PLACEHOLDER_SRC;
    };
    img.src = c.imageSrc;
    media.classList.remove('hidden');
  } else {
    // если изображения нет в данных, сразу показываем плейсхолдер
    img.src = PLACEHOLDER_SRC;
    media.classList.remove('hidden');
  }

  // Если включён авто-показ ответа, открываем детали
  if(localStorage.getItem('sdlv_autoFlip') === '1'){
    setTimeout(() => details.open = true, 200);
  }
  
  node.querySelectorAll('.actions button').forEach(btn=>{
    btn.addEventListener('click', ()=>{ handleGrade(c.id, btn.dataset.grade); });
  });
  return node;
}

// Controls
function wire(){
  // Обработчики для новых кнопок управления
  const btnStartTraining = document.getElementById('btnStartTraining');
  const btnFinish = document.getElementById('btnFinish');
  const btnReset = document.getElementById('btnReset');

    // отображаем сцену с карточками

  });

  btnFinish.addEventListener('click', () => {
    window.location.href = '../index.html';
  });

  // Кнопка «Начать заново» сбрасывает весь прогресс и возвращает состояние до старта тренировки
  btnReset.addEventListener('click', () => {
    if(!confirm('Сбросить прогресс и начать заново?')) return;
    // Очищаем данные по каждой карточке
    db.cards = {};
    for(const c of allCards){
      db.cards[c.id] = {n:0, ef:2.5, interval:0, due:today(), lapses:0, last:null, deck:c.section, lastGrade:2};
    }
    save();
    queue = [];
    queueDirty = true;
    // Снова показываем кнопку запуска и скрываем сцену
    trainingStarted = false;
    const stageEl = document.getElementById('stage');
    stageEl.style.display = 'none';
    // Не показываем кнопку запуска в шапке после сброса — запуск происходит из модального окна
    btnStartTraining.style.display = 'none';
    // Скрываем текущую информацию о выбранном меню/разделе
    const infoEl = document.getElementById('currentInfo');
    if(infoEl){ infoEl.style.display = 'none'; }
    // Обновляем статистику (отображаем общее количество карточек, распределённых по сложности)
    document.getElementById('stats').textContent = statLine();

    // После сброса прогресса вновь показываем окно выбора профиля.
    // Это позволяет пользователю выбрать меню, раздел и направление ещё раз.
    const backdrop = document.getElementById('startBackdrop');
    if(backdrop){
      backdrop.style.display = '';
    }
    // Если ранее был выбран профиль, попробуем восстановить его в форме.
    // Это также обновит состояние кнопки запуска тренировки.
    const menuSelectReset = document.getElementById('menuSelect');
    const sectionSelectReset = document.getElementById('sectionSelect');
    const startBtnModal = document.getElementById('startBtn');
    const typeSelectReset = document.getElementById('typeSelect');
    if(profile && profile.menu){
      menuSelectReset.value = profile.menu;
      menuSelectReset.dispatchEvent(new Event('change'));
      if(profile.menu === 'Основное меню'){
        // При необходимости заполнить список разделов перед установкой значения
        if(typeof fillSections === 'function'){
          fillSections();
        }
        if(profile.section === null){
          sectionSelectReset.value = '__ALL__';
        } else if(profile.section){
          sectionSelectReset.value = profile.section;
        }
        sectionSelectReset.dispatchEvent(new Event('change'));
      } else {
        // Для других меню сразу активируем кнопку
        startBtnModal.disabled = false;
      }
    } else {
      // Если профиля нет, сбрасываем выбор и блокируем кнопку запуска
      menuSelectReset.value = '';
      if(sectionSelectReset){ sectionSelectReset.value = ''; }
      startBtnModal.disabled = true;
    }
    // Восстанавливаем выбранное направление тренировки, если оно есть
    if(profile && profile.trainingType && typeSelectReset){
      typeSelectReset.value = profile.trainingType;
    }
  });

  document.addEventListener('keydown', (e) => {
  const t = e.target;
  if (!(t instanceof HTMLElement)) return;

  // Не перехватывать, когда курсор в любых полях/редакторах или в модалке редактора
  if (t.isContentEditable) return;
  if (t.closest('input, textarea, select, button, [contenteditable="true"], .card-editor-modal')) return;

  // Пробел раскрывает/скрывает ответ
  if (e.code === 'Space') {
    const det = document.querySelector('details.qa');
    if (det) {
      det.open = !det.open;
      e.preventDefault();
    }
    return;
  }

  // 1,2,3 = оценки
  const map = { Digit1: '2', Digit2: '3', Digit3: '5' };
  const key = map[e.code];
  if (key) {
    const btn = document.querySelector(`.actions button[data-grade="${key}"]`);
    if (btn) btn.click();
  }
});


  // Start modal logic
  const menuSelect = document.getElementById('menuSelect');
  const sectionRow = document.getElementById('sectionRow');
  const sectionSelect = document.getElementById('sectionSelect');
  const startBtn = document.getElementById('startBtn');
  const hint = document.getElementById('startHint');

  function fillSections(){
    sectionSelect.innerHTML = '<option value="" disabled selected>— выбрать —</option>';
    // Добавляем "Все разделы"
    const allOpt = document.createElement('option');
    allOpt.value = '__ALL__'; allOpt.textContent = 'Все разделы';
    sectionSelect.appendChild(allOpt);
    if(window.__MAIN_H2 && window.__MAIN_H2.length){
      window.__MAIN_H2.forEach(h2=>{
        const opt = document.createElement('option'); opt.value = h2; opt.textContent = h2; sectionSelect.appendChild(opt);
      });
    }
  }

  menuSelect.addEventListener('change', ()=>{
    const v = menuSelect.value;
    profile.menu = v;
    if(v==='Всё меню'){
      sectionRow.style.display='none'; profile.section=null; startBtn.disabled=false;
      hint.textContent='Будут карточки из всех доступных меню.';
    } else if(v==='Основное меню'){
      sectionRow.style.display='block'; fillSections(); startBtn.disabled = (sectionSelect.value==='');
      hint.textContent='Выбери раздел или «Все разделы».';
    } else {
      sectionRow.style.display='none'; profile.section=null; startBtn.disabled=false;
      hint.textContent='Пока подключены карточки только из «Основное меню» (если другие файлы не добавлены).';
    }
  });

  sectionSelect.addEventListener('change', ()=>{
    if(sectionSelect.value==='__ALL__'){ profile.section = null; startBtn.disabled = false; }
    else { profile.section = sectionSelect.value || null; startBtn.disabled = !profile.section; }
  });

  startBtn.addEventListener('click', ()=>{
    // Запоминаем выбранное направление тренировки
    const typeSelect = document.getElementById('typeSelect');
    profile.trainingType = typeSelect.value || 'desc';
    // Сохраняем последний выбранный профиль (меню, раздел и направление)
    db.lastProfile = profile;
    save();
    // Закрываем модальное окно выбора
    document.getElementById('startBackdrop').style.display = 'none';
    // Отображаем информацию о выбранном меню, разделе и направлении в шапке
    const infoEl = document.getElementById('currentInfo');
    const parts = [];
    // Меню
    if(profile.menu){
      parts.push(profile.menu);
    }
    // Раздел
    if(profile.menu === 'Основное меню'){
      if(profile.section){
        parts.push(profile.section);
      } else {
        parts.push('Все разделы');
      }
    }
    // Направление
    const typeMap = {
      desc:'Красочное описание',
      feat:'Особенности',
      comp:'Состав',
      blindphoto:'Слепой тест: по фото'
    };
    if(profile.trainingType && typeMap[profile.trainingType]){
      parts.push(typeMap[profile.trainingType]);
    }
    const infoText = parts.join(' • ');
    infoEl.textContent = infoText;
    infoEl.style.display = infoText ? '' : 'none';
    // Автоматически запускаем тренировку после выбора профиля
    // Фиксируем факт начала тренировки
    trainingStarted = true;
    // Скрываем кнопку запуска в шапке (она теперь не нужна)
    const btnStartTraining = document.getElementById('btnStartTraining');
    if(btnStartTraining){ btnStartTraining.style.display = 'none'; }
    // Отображаем сцену с карточками
    const stageEl = document.getElementById('stage');
    stageEl.style.display = '';
    // Обновляем статистику и формируем очередь
    queueDirty = true;
    render();
  });

  // Restore profile if exists
  if(db.lastProfile){
    profile = db.lastProfile;
    // Восстанавливаем выбранное меню
    if(profile.menu){
      menuSelect.value = profile.menu;
      menuSelect.dispatchEvent(new Event('change'));
    }
    // Восстанавливаем раздел в случае основного меню
    if(profile.section === null && profile.menu === 'Основное меню'){
      // выбрать "Все разделы"
      setTimeout(() => {
        fillSections();
        sectionSelect.value = '__ALL__';
        startBtn.disabled = false;
      }, 200);
    } else if(profile.section){
      setTimeout(() => {
        fillSections();
        sectionSelect.value = profile.section;
        startBtn.disabled = false;
      }, 200);
    }
    // Восстанавливаем направление тренировки
    const typeSelect = document.getElementById('typeSelect');
    if(profile.trainingType && typeSelect){
      typeSelect.value = profile.trainingType;
    }
  }
}

<script>
// === Auto-fill imageSrc for cards without images using GitHub images dir ===
async function fetchImageFiles() {
  try {
    const res = await fetch('https://api.github.com/repos/witek746653-maker/Menu/contents/images', {
      headers: { 'Accept': 'application/vnd.github+json' }
    });
    if (!res.ok) return [];
    const data = await res.json();
    return (Array.isArray(data) ? data : []).filter(x => x.type === 'file').map(x => x.name.toLowerCase());
  } catch (e) {
    console.warn('GitHub images fetch failed:', e);
    return [];
  }
}

function slugifyTitleForMatch(s){
  return (s || '')
    .toLowerCase()
    .replace(/[ё]/g,'е')
    .replace(/[^a-z0-9\u0400-\u04FF]+/g,' ')  // keep Latin/Cyrillic letters and digits
    .trim();
}

function guessImageForTitle(title, files){
  if (!files || !files.length) return null;
  const t = slugifyTitleForMatch(title);

  // Priority 1: noun keywords
  const keywords = t.split(' ').filter(Boolean);
  const exts = ['.jpg','.jpeg','.png','.webp','.gif'];

  // 1) If any file contains all first two keywords in order
  if (keywords.length >= 2) {
    const hit = files.find(f => f.includes(keywords[0]) && f.includes(keywords[1]));
    if (hit) return hit;
  }

  // 2) Try any single strong keyword hit
  const strong = ['устриц','осьминог','мид','тунец','сибас','семг','дорадо','краб','кревет','гребеш','бекон','буррата','картоф','шпинат','баклажан','трюфел','стейк','рибай','каре','ягн','говяж','минестроне','фондан','морожен','сорбет','ризотто','фуа','груша','кальмар','перец','цук','томат','бургер','салат','суп'];
  const k = strong.find(k => t.includes(k));
  if (k) {
    const hit = files.find(f => f.includes(k));
    if (hit) return hit;
  }

  // 3) Try any file that contains the first keyword
  if (keywords.length) {
    const hit = files.find(f => f.includes(keywords[0]));
    if (hit) return hit;
  }

  // 4) Give up
  return null;
}

// Wrap original loadCards to enrich missing images
(function(){
  const __origLoadCards = window.loadCards;
  window.loadCards = async function(){
    await __origLoadCards();
    try {
      const files = await fetchImageFiles();
      if (files && files.length) {
        let patched = 0;
        for (const c of window.allCards) {
          if (!c.imageSrc || c.imageSrc === 'icons/image.png' || c.imageSrc === 'images/noroot.png') {
            const guess = guessImageForTitle(c.title || '', files);
            if (guess) {
              c.imageSrc = 'images/' + guess;
              patched++;
            }
          }
        }
        if (patched) {
          // Re-render current view to show images
          if (typeof window.render === 'function') {
            try { window.render(); } catch(e){}
          }
          console.info('Auto-filled images for', patched, 'cards.');
        }
      }
    } catch (e) {
      console.warn('Auto image fill failed:', e);
    }
  };
})();
</script>
