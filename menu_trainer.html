<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Menu Trainer</title>
    <style>
        /* Основные цветовые переменные для тем оформления ресторана */
        :root {
            /* Цвета темы ресторана с использованием мягких градиентов */
            --bg-color-start: #fefdf7; /* верхний цвет фона: очень светлый кремовый */
            --bg-color-end: #fefdf7;   /* нижний цвет фона: тот же цвет для однородного фона */
            --card-bg-start: rgba(255, 235, 210, 0.15); /* начало градиента карты: теплый беж */
            --card-bg-end: rgba(255, 224, 196, 0.08);  /* конец градиента карты */
            --text-color: #3d2a1a; /* тёмный текст для светлого фона */
            --accent: #e4b36d;      /* мягкий золотистый акцент */
            --accent-2: #d9a055;    /* приглушенный оранжевый */
            --button-bg-start: #e5b682; /* начало градиента кнопки: карамель */
            --button-bg-end: #d89c5e;  /* конец градиента кнопки */
            --button-bg-hover-start: #f0c78a; /* нажатие/hover */
            --button-bg-hover-end: #e6ad71;
            --button-text: #4a2f1b; /* тёмный текст на кнопке */
        }

        /* Базовые стили */
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-image: linear-gradient(to bottom right, var(--bg-color-start), var(--bg-color-end));
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin: 1.2em 0 0.5em;
            font-size: 2.2em;
            color: var(--accent);
        }

        #controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        label {
            font-size: 1em;
            margin-right: 0.4em;
        }

        select, button {
            background-image: linear-gradient(to bottom right, var(--button-bg-start), var(--button-bg-end));
            color: var(--button-text);
            border: 1px solid var(--accent-2);
            border-radius: 10px;
            padding: 0.6em 1em;
            font-size: 1.1em;
            outline: none;
            cursor: pointer;
            transition: background-image 0.2s ease, transform 0.1s ease;
        }

        select:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        select option {
            /* Настройка цвета элементов списка */
            background-color: var(--bg-color);
            color: var(--accent);
        }

        button:hover {
            background-image: linear-gradient(to bottom right, var(--button-bg-hover-start), var(--button-bg-hover-end));
        }
        button:active {
            transform: scale(0.98);
        }

        #cardContainer {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
            padding: 0 20px;
        }

        #card {
            border: 1px solid var(--accent-2);
            border-radius: 16px;
            background-image: linear-gradient(to bottom right, var(--card-bg-start), var(--card-bg-end));
            padding: 26px;
            margin-bottom: 18px;
            min-height: 160px;
            display: none;
            box-shadow: 0 10px 24px rgba(0,0,0,0.5);
        }

        /* Класс для анимации появления карточки */
        .fade-in {
            animation: fadeInUp 0.5s ease both;
        }

        #question {
            font-weight: bold;
            font-size: 1.5em;
            margin-bottom: 12px;
        }

        #answer {
            margin-top: 12px;
            font-size: 1.2em;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        #cardButtons {
            display: none;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }

        #cardButtons button {
            min-width: 120px;
        }

        #progress {
            margin-top: 10px;
            font-size: 1em;
            color: var(--accent);
        }

        /* Modal overlay for enlarged images */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
        }
        .modal.show {
            display: flex;
        }
        .modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 14px;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
        }
        #closeModal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        #message {
            text-align: center;
            font-size: 1.2em;
            margin-top: 20px;
            color: var(--accent);
        }

        /* Анимация плавного появления карточки */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translate3d(0, 20px, 0);
            }
            to {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }

        /* Адаптивность для мобильных устройств */
        @media (max-width: 600px) {
            h1 {
                font-size: 1.6em;
            }
            #question {
                font-size: 1.3em;
            }
            #answer {
                font-size: 1em;
            }
            select, button {
                font-size: 1em;
                width: 100%;
                max-width: none;
            }
            #controls {
                width: 100%;
                padding: 0 15px;
            }
            #card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <h1>Тренажёр меню</h1>
    <div id="controls">
        <!-- Выбор файла меню. Файлы должны находиться в той же директории, что и этот тренажёр -->
        <label for="menuSelect">Выберите меню:</label>
        <select id="menuSelect"></select>
        <!-- После выбора меню появляется выбор раздела -->
        <select id="sectionSelect" style="display:none;"></select>
        <!-- Выбор специализации: описание, особенности или состав -->
        <select id="specializationSelect" style="display:none;">
            <option value="">Без специализации</option>
            <option value="description">Красочное описание</option>
            <option value="features">Особенности</option>
            <option value="composition">Состав</option>
        </select>
        <button id="startBtn" style="display:none;">Начать тренировку</button>
    </div>
    <div id="cardContainer">
        <div id="card">
            <div id="question"></div>
            <!-- Image of the dish -->
            <img id="cardImage" style="display:none; max-width:100%; border-radius:12px; margin-top:12px; cursor:pointer;"/>
            <div id="noImageMsg" style="display:none; margin-top:12px; font-style:italic; color: var(--accent-2);">Фото не добавлено</div>
            <div id="answer" style="display:none;"></div>
        </div>
        <div id="cardButtons" style="display:none;">
            <button id="showAnswerBtn">Показать ответ</button>
            <button id="knowBtn" style="display:none;">Я знаю</button>
            <button id="dontKnowBtn" style="display:none;">Не помню</button>
        </div>
        <div id="progress"></div>
        <div id="message"></div>
    </div>

    <!-- Modal for enlarged dish images -->
    <div id="imageModal" class="modal">
        <span id="closeModal">&times;</span>
        <img id="modalImage" src="" alt="Enlarged dish image" />
    </div>

    <script>
    (() => {
        // Global variables to hold parsed document and cards
        let currentDoc = null;
        let currentCards = [];
        let currentIndex = 0;

        const menuSelect = document.getElementById('menuSelect');
        const sectionSelect = document.getElementById('sectionSelect');
        const specializationSelect = document.getElementById('specializationSelect');
        const startBtn = document.getElementById('startBtn');
        const cardDiv = document.getElementById('card');
        const questionDiv = document.getElementById('question');
        const answerDiv = document.getElementById('answer');
        const cardButtons = document.getElementById('cardButtons');
        const showAnswerBtn = document.getElementById('showAnswerBtn');
        const knowBtn = document.getElementById('knowBtn');
        const dontKnowBtn = document.getElementById('dontKnowBtn');
        const progressDiv = document.getElementById('progress');
        const messageDiv = document.getElementById('message');

        // Elements for images and modal
        const cardImage = document.getElementById('cardImage');
        const noImageMsg = document.getElementById('noImageMsg');
        const imageModal = document.getElementById('imageModal');
        const modalImage = document.getElementById('modalImage');
        const closeModalBtn = document.getElementById('closeModal');

        // Image click handler to show modal
        cardImage.addEventListener('click', () => {
            const src = cardImage.getAttribute('src');
            if (src) {
                modalImage.src = src;
                imageModal.classList.add('show');
            }
        });
        // Close modal when clicking on the close button
        closeModalBtn.addEventListener('click', () => {
            imageModal.classList.remove('show');
        });
        // Also close modal when clicking outside the image
        imageModal.addEventListener('click', (e) => {
            if (e.target === imageModal) {
                imageModal.classList.remove('show');
            }
        });

        /**
         * Список HTML‑файлов меню, находящихся рядом с этим тренажёром.
         * Добавляйте сюда имена новых файлов меню по мере их появления.
         */
        const menuFiles = [
            'avtorskie-zavtraki_(3.09).html',
            'detskoe-menu_(3.09).html',
            'festivaly_(3.09).html',
            'osnovnoe-menu_(3.09).html',
            'sezonnoe-menu_(3.09).html',
            'vino_(11.09).html',
            'Stuff.html'
        ];
        // Специальное значение для варианта "Все меню"
        const ALL_MENUS_VALUE = '__all__';
        // Специальное значение для варианта "Все разделы"
        const ALL_SECTIONS_VALUE = '__all_sections__';

        /**
         * Словарь соответствия файлов меню их пользовательским названиям.
         * Если необходимо добавить новые файлы, расширьте этот объект.
         */
        const menuDisplayNames = {
            'avtorskie-zavtraki_(3.09).html': 'Авторские завтраки',
            'detskoe-menu_(3.09).html': 'Детское меню',
            'festivaly_(3.09).html': 'Фестивали',
            'osnovnoe-menu_(3.09).html': 'Основное меню',
            'sezonnoe-menu_(3.09).html': 'Сезонное меню',
            'vino_(11.09).html': 'Вино',
            'Stuff.html': 'Прочее'
        };

        /**
         * Заполнение списка меню. Использует словарь menuDisplayNames для
         * человеко‑понятных названий. Если в словаре нет соответствия, имя
         * файла будет использовано без изменения.
         */
        function populateMenuList() {
            menuSelect.innerHTML = '';
            const placeholder = document.createElement('option');
            placeholder.textContent = 'Выберите меню';
            placeholder.value = '';
            placeholder.disabled = true;
            placeholder.selected = true;
            menuSelect.appendChild(placeholder);
            // Добавляем пункт для тренировки сразу по всем меню
            const allOpt = document.createElement('option');
            allOpt.value = ALL_MENUS_VALUE;
            allOpt.textContent = 'Все меню';
            menuSelect.appendChild(allOpt);
            menuFiles.forEach(filename => {
                const option = document.createElement('option');
                option.value = filename;
                option.textContent = menuDisplayNames[filename] || filename;
                menuSelect.appendChild(option);
            });
        }

        // Заполняем список меню сразу после определения элементов
        populateMenuList();

        // Utility function to strip excessive whitespace from strings
        function cleanText(text) {
            return text.replace(/\s+/g, ' ').trim();
        }

        // Fetch and parse the selected menu file to populate sections
        menuSelect.addEventListener('change', () => {
            const selected = menuSelect.value;
            // Очистим сообщение
            messageDiv.textContent = '';
            // Если выбран вариант "Все меню", скрываем выбор разделов и сразу разрешаем начать
            if (selected === ALL_MENUS_VALUE) {
                sectionSelect.style.display = 'none';
                startBtn.style.display = 'inline';
                // Показываем выбор специализации
                specializationSelect.style.display = 'inline';
                return;
            }
            if (!selected) {
                sectionSelect.style.display = 'none';
                startBtn.style.display = 'none';
                specializationSelect.style.display = 'none';
                return;
            }
            // Загрузка выбранного файла
            sectionSelect.style.display = 'none';
            startBtn.style.display = 'none';
            messageDiv.textContent = 'Загружаем меню…';
            fetch(encodeURI(selected))
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Не удалось загрузить файл меню: ' + selected);
                    }
                    return response.text();
                })
                .then(htmlString => {
                    const parser = new DOMParser();
                    currentDoc = parser.parseFromString(htmlString, 'text/html');
                    // Собираем разделы
                    const h2s = Array.from(currentDoc.querySelectorAll('h2'));
                    const sections = h2s.map(h2 => cleanText(h2.textContent)).filter(Boolean);
                    sectionSelect.innerHTML = '';
                    if (sections.length === 0) {
                        sectionSelect.style.display = 'none';
                        startBtn.style.display = 'none';
                        messageDiv.textContent = 'Разделы не найдены в выбранном меню.';
                        return;
                    }
                    // Добавляем вариант для всех разделов
                    const allSectionsOption = document.createElement('option');
                    allSectionsOption.value = ALL_SECTIONS_VALUE;
                    allSectionsOption.textContent = 'Все разделы';
                    sectionSelect.appendChild(allSectionsOption);
                    sections.forEach(sectionName => {
                        const option = document.createElement('option');
                        option.value = sectionName;
                        option.textContent = sectionName;
                        sectionSelect.appendChild(option);
                    });
                    sectionSelect.style.display = 'inline';
                    startBtn.style.display = 'inline';
                    // Показываем выбор специализации для отдельных меню
                    specializationSelect.style.display = 'inline';
                    messageDiv.textContent = '';
                })
                .catch(err => {
                    messageDiv.textContent = err.message;
                });
        });

        // Extract cards for the given section name from the parsed document
        function getCardsForSection(sectionName) {
            if (!currentDoc) return [];
            // Find all h2 elements again
            const h2s = Array.from(currentDoc.querySelectorAll('h2'));
            let startH2 = null;
            let nextH2 = null;
            for (let i = 0; i < h2s.length; i++) {
                const title = cleanText(h2s[i].textContent);
                if (title === cleanText(sectionName)) {
                    startH2 = h2s[i];
                    nextH2 = h2s[i + 1] || null;
                    break;
                }
            }
            if (!startH2) return [];
            const cards = [];
            // Iterate through siblings until next section
            let elem = startH2.nextElementSibling;
            while (elem && elem !== nextH2) {
                // Collect h3s either directly on this element or nested within it
                const h3s = [];
                if (elem.tagName && elem.tagName.toLowerCase() === 'h3') {
                    h3s.push(elem);
                } else {
                    elem.querySelectorAll && elem.querySelectorAll('h3').forEach(h => h3s.push(h));
                }
                if (h3s.length > 0) {
                    h3s.forEach(h3 => {
                        const question = cleanText(h3.textContent);
                        let answerParts = [];
                        let sibling = h3.nextElementSibling;
                        while (sibling) {
                            const tag = sibling.tagName ? sibling.tagName.toLowerCase() : '';
                            if (tag === 'h3' || tag === 'h2') {
                                break;
                            }
                            answerParts.push(cleanText(sibling.textContent || ''));
                            sibling = sibling.nextElementSibling;
                        }
                        // Build both joined answer and an array of individual parts. Each sibling element becomes a separate part.
                        const cleanedParts = answerParts.filter(Boolean);
                        const answer = cleanedParts.join('\n');
                        // Gather images inside the card (between this h3 and the next h3/h2)
                        const candidateImgs = [];
                        let imgCollectElem = h3.nextElementSibling;
                        while (imgCollectElem) {
                            const tagName = imgCollectElem.tagName ? imgCollectElem.tagName.toLowerCase() : '';
                            if (tagName === 'h3' || tagName === 'h2') {
                                break;
                            }
                            if (tagName === 'img') {
                                candidateImgs.push(imgCollectElem);
                            }
                            if (imgCollectElem.querySelectorAll) {
                                imgCollectElem.querySelectorAll('img').forEach(img => candidateImgs.push(img));
                            }
                            imgCollectElem = imgCollectElem.nextElementSibling;
                        }
                        // Filter candidate images: skip obvious icons (small width attr or file names containing 'icon', 'allergen', 'ico')
                        let mainImg = null;
                        candidateImgs.some(img => {
                            const src = img.getAttribute('src') || '';
                            const widthAttr = img.getAttribute('width');
                            // if width attribute exists and is numeric and <= 60, skip
                            if (widthAttr && !isNaN(parseInt(widthAttr)) && parseInt(widthAttr) <= 60) return false;
                            const lowerSrc = src.toLowerCase();
                            if (lowerSrc.includes('icon') || lowerSrc.includes('allergen') || lowerSrc.includes('ico')) return false;
                            mainImg = src;
                            return true;
                        });
                        cards.push({ question, answer, answerParts: cleanedParts, imageSrc: mainImg });
                    });
                }
                elem = elem.nextElementSibling;
            }
            return cards;
        }

        // Shuffle cards for random order (Fisher–Yates shuffle)
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        /**
         * Собрать все карточки из текущего выбранного меню (все разделы).
         * Использует глобальный currentDoc.
         */
        function getAllCardsInCurrentMenu() {
            if (!currentDoc) return [];
            const h2s = Array.from(currentDoc.querySelectorAll('h2'));
            let cards = [];
            h2s.forEach((h2, index) => {
                const sectionName = cleanText(h2.textContent);
                const sectionCards = getCardsForSection(sectionName);
                if (sectionCards && sectionCards.length) {
                    cards.push(...sectionCards);
                }
            });
            return cards;
        }

        /**
         * Извлекает все карточки из объекта Document. Используется для режима "Все меню".
         */
        function extractAllCardsFromDoc(doc) {
            const cards = [];
            const h2s = Array.from(doc.querySelectorAll('h2'));
            h2s.forEach((h2, index) => {
                const nextH2 = h2s[index + 1] || null;
                let elem = h2.nextElementSibling;
                while (elem && elem !== nextH2) {
                    const h3s = [];
                    if (elem.tagName && elem.tagName.toLowerCase() === 'h3') {
                        h3s.push(elem);
                    } else {
                        elem.querySelectorAll && elem.querySelectorAll('h3').forEach(h => h3s.push(h));
                    }
                    if (h3s.length > 0) {
                        h3s.forEach(h3 => {
                            const question = cleanText(h3.textContent);
                            let answerParts = [];
                            let sibling = h3.nextElementSibling;
                            while (sibling) {
                                const tag = sibling.tagName ? sibling.tagName.toLowerCase() : '';
                                if (tag === 'h3' || tag === 'h2') {
                                    break;
                                }
                                answerParts.push(cleanText(sibling.textContent || ''));
                                sibling = sibling.nextElementSibling;
                            }
                            const cleanedParts = answerParts.filter(Boolean);
                            const answer = cleanedParts.join('\n');
                            // Gather images inside this card region (between this h3 and the next h3/h2)
                            const candidateImgs = [];
                            let imgCollectElem2 = h3.nextElementSibling;
                            while (imgCollectElem2) {
                                const tagName2 = imgCollectElem2.tagName ? imgCollectElem2.tagName.toLowerCase() : '';
                                if (tagName2 === 'h3' || tagName2 === 'h2') {
                                    break;
                                }
                                if (tagName2 === 'img') {
                                    candidateImgs.push(imgCollectElem2);
                                }
                                if (imgCollectElem2.querySelectorAll) {
                                    imgCollectElem2.querySelectorAll('img').forEach(img => candidateImgs.push(img));
                                }
                                imgCollectElem2 = imgCollectElem2.nextElementSibling;
                            }
                            let mainImg2 = null;
                            candidateImgs.some(img => {
                                const src = img.getAttribute('src') || '';
                                const widthAttr = img.getAttribute('width');
                                if (widthAttr && !isNaN(parseInt(widthAttr)) && parseInt(widthAttr) <= 60) return false;
                                const lowerSrc = src.toLowerCase();
                                if (lowerSrc.includes('icon') || lowerSrc.includes('allergen') || lowerSrc.includes('ico')) return false;
                                mainImg2 = src;
                                return true;
                            });
                            cards.push({ question, answer, answerParts: cleanedParts, imageSrc: mainImg2 });
                        });
                    }
                    elem = elem.nextElementSibling;
                }
            });
            return cards;
        }

        /**
         * Загружает все файлы меню и собирает карточки из каждого. Используется при выборе "Все меню".
         */
        async function getCardsForAllMenus() {
            const allCards = [];
            for (const file of menuFiles) {
                try {
                    const response = await fetch(encodeURI(file));
                    if (!response.ok) continue;
                    const htmlString = await response.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlString, 'text/html');
                    const cards = extractAllCardsFromDoc(doc);
                    if (cards && cards.length) {
                        allCards.push(...cards);
                    }
                } catch (e) {
                    // Игнорируем ошибки загрузки отдельных меню
                    continue;
                }
            }
            return allCards;
        }

        // Start training when button clicked
        startBtn.addEventListener('click', () => {
            const selectedMenu = menuSelect.value;
            // Если пользователь выбрал "Все меню"
            if (selectedMenu === ALL_MENUS_VALUE) {
                messageDiv.textContent = 'Загружаем все меню…';
                getCardsForAllMenus().then(cards => {
                    if (!cards.length) {
                        messageDiv.textContent = 'Не удалось найти карточки для тренировок.';
                        return;
                    }
                    currentCards = shuffle(cards);
                    currentIndex = 0;
                    prepareTrainingUI();
                }).catch(err => {
                    messageDiv.textContent = err.message;
                });
                return;
            }
            // Иначе используем текущий документ (selectedMenu) для тренировки
            const sectionName = sectionSelect.value;
            let cards = [];
            if (sectionName === ALL_SECTIONS_VALUE) {
                // Собрать все карточки во всех разделах текущего меню
                cards = getAllCardsInCurrentMenu();
            } else {
                cards = getCardsForSection(sectionName);
            }
            if (cards.length === 0) {
                messageDiv.textContent = 'Карточки не найдены.';
                cardDiv.style.display = 'none';
                cardButtons.style.display = 'none';
                return;
            }
            currentCards = shuffle(cards);
            currentIndex = 0;
            prepareTrainingUI();
        });

        /**
         * Подготавливает интерфейс для отображения карточек после загрузки карточек
         */
        function prepareTrainingUI() {
            // Спрятать выбор меню/разделов, показать панель карточек
            sectionSelect.style.display = 'none';
            startBtn.style.display = 'none';
            menuSelect.style.display = 'none';
            cardButtons.style.display = 'block';
            showAnswerBtn.style.display = 'inline';
            knowBtn.style.display = 'none';
            dontKnowBtn.style.display = 'none';
            cardDiv.style.display = 'block';
            messageDiv.textContent = '';
            showCurrentCard();
        }

        // Display the current card front
        function showCurrentCard() {
            if (currentCards.length === 0) {
                finishTraining();
                return;
            }
            const card = currentCards[currentIndex];
            questionDiv.textContent = card.question;
            // Set image or placeholder
            if (card.imageSrc) {
                cardImage.src = card.imageSrc;
                cardImage.style.display = 'block';
                noImageMsg.style.display = 'none';
            } else {
                cardImage.style.display = 'none';
                noImageMsg.style.display = 'block';
            }
            // Determine which part of the answer to show based on selected specialization
            const spec = specializationSelect.value;
            let answerText;
            if (!spec) {
                // no specialization – show the full answer
                answerText = card.answer;
            } else {
                // choose part based on specialization index
                // 0: description, 1: features, 2: composition
                const indexMap = {
                    'description': 0,
                    'features': 1,
                    'composition': 2
                };
                const idx = indexMap[spec];
                if (card.answerParts && card.answerParts.length > idx) {
                    answerText = card.answerParts[idx];
                } else {
                    // fallback to the last available part or full answer
                    answerText = card.answerParts && card.answerParts.length ? card.answerParts[card.answerParts.length - 1] : card.answer;
                }
            }
            answerDiv.textContent = answerText;
            answerDiv.style.display = 'none';
            showAnswerBtn.style.display = 'inline';
            knowBtn.style.display = 'none';
            dontKnowBtn.style.display = 'none';
            progressDiv.textContent = `Карточка ${currentIndex + 1} из ${currentCards.length}`;
            // Запускаем анимацию появления каждой карточки
            cardDiv.classList.remove('fade-in');
            // force reflow to restart animation
            void cardDiv.offsetWidth;
            cardDiv.classList.add('fade-in');
        }

        // Reveal answer
        showAnswerBtn.addEventListener('click', () => {
            answerDiv.style.display = 'block';
            showAnswerBtn.style.display = 'none';
            knowBtn.style.display = 'inline';
            dontKnowBtn.style.display = 'inline';
        });

        // User knows the card: remove it
        knowBtn.addEventListener('click', () => {
            currentCards.splice(currentIndex, 1);
            if (currentIndex >= currentCards.length) {
                currentIndex = 0;
            }
            if (currentCards.length === 0) {
                finishTraining();
            } else {
                showCurrentCard();
            }
        });

        // User doesn't know the card: move it to the end
        dontKnowBtn.addEventListener('click', () => {
            const card = currentCards.splice(currentIndex, 1)[0];
            currentCards.push(card);
            if (currentIndex >= currentCards.length) {
                currentIndex = 0;
            }
            showCurrentCard();
        });

        // Finish training session
        function finishTraining() {
            cardDiv.style.display = 'none';
            cardButtons.style.display = 'none';
            progressDiv.textContent = '';
            messageDiv.textContent = 'Тренировка завершена! Отличная работа!';
        }
    })();
    </script>
</body>
</html>
