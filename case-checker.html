<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Case Checker — icons/ & images/</title>
<style>
  :root { --ok: #1a7f37; --bad: #d1242f; --warn: #b78103; --muted: #667085; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; }
  h1 { margin: 0 0 12px; }
  .hint { color: var(--muted); margin-bottom: 18px; }
  .controls { display: flex; gap: 12px; flex-wrap: wrap; margin: 12px 0 18px; align-items: center; }
  button { padding: 8px 12px; border-radius: 8px; border: 1px solid #ddd; background: #f8f8f8; cursor: pointer; }
  button:focus { outline: 2px solid #8ab4f8; outline-offset: 2px; }
  input[type="search"] { padding: 8px 12px; border-radius: 8px; border: 1px solid #ddd; min-width: 260px; }
  .stat { font-weight: 600; }
  .stat.ok { color: var(--ok); }
  .stat.bad { color: var(--bad); }
  .grid { display: grid; grid-template-columns: 140px 1fr; gap: 12px; }
  .row { display: contents; }
  .thumb { width: 140px; height: 90px; object-fit: contain; border: 1px solid #eee; background: #fafafa; }
  .path { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; word-break: break-all; }
  .tag { display: inline-block; font-size: 12px; padding: 2px 6px; border-radius: 999px; border: 1px solid #ddd; background:#fff; margin-left: 6px; }
  .tag.ok { border-color: var(--ok); color: var(--ok); }
  .tag.bad { border-color: var(--bad); color: var(--bad); }
  .tag.warn { border-color: var(--warn); color: var(--warn); }
  .sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
</style>
</head>
<body>
  <h1>Проверка регистра путей</h1>
  <div class="hint">Положи этот файл в корень репозитория (рядом с папками <code>icons/</code> и <code>images/</code>) и открой в браузере. 
  Если статус <span class="stat ok">OK</span> — путь совпадает по регистру. <span class="stat bad">NOT FOUND</span> — файла нет по точному регистру (возможна ошибка регистра).</div>

  <div class="controls">
    <button id="showAll">Все</button>
    <button id="showBad">Только NOT FOUND</button>
    <input id="q" type="search" placeholder="Фильтр по пути…" />
    <span id="counters" class="stat"></span>
  </div>

  <div id="list" class="grid" role="table" aria-label="Список файлов"></div>

<script>

es/_DSC7445.jpg", "icons/f751fe1f-ef60-4a98-a028-be3113d84654.png"];

const list = document.getElementById('list');
const counters = document.getElementById('counters');
const q = document.getElementById('q');
let filterMode = 'all'; // 'all' | 'bad'
let query = '';

function render(items) {
  list.innerHTML = '';
  let ok = 0, bad = 0;
  items.forEach((p, i) => {
    const rid = 'r' + i;
    const row = document.createElement('div');
    row.className = 'row';
    row.setAttribute('role', 'row');
    row.dataset.path = p;

    const img = document.createElement('img');
    img.src = p + (p.includes('?') ? '' : '?_=' + Date.now()); // bust cache
    img.alt = '';
    img.className = 'thumb';
    img.loading = 'lazy';

    const meta = document.createElement('div');
    const path = document.createElement('div');
    path.className = 'path';
    path.textContent = p;

    const tag = document.createElement('span');
    tag.className = 'tag warn';
    tag.textContent = 'CHECKING…';

    const ext = p.split('.').pop().toLowerCase();
    const warn = (/[А-ЯЁа-яё]/.test(p) || /\s/.test(p)) ? ' ⚠︎' : '';

    meta.appendChild(path);
    meta.appendChild(tag);
    if (warn) {
      const t = document.createElement('span');
      t.className = 'tag warn';
      t.textContent = 'Подозрительно' + warn;
      meta.appendChild(t);
    }

    row.appendChild(img);
    row.appendChild(meta);
    list.appendChild(row);

    img.onload = () => {
      tag.textContent = 'OK';
      tag.className = 'tag ok';
      ok++;
      updateCounters(ok, bad, items.length);
      applyFilters();
    };
    img.onerror = () => {
      tag.textContent = 'NOT FOUND';
      tag.className = 'tag bad';
      bad++;
      updateCounters(ok, bad, items.length);
      applyFilters();
    };
  });
  updateCounters(ok, bad, items.length);
}

function updateCounters(ok, bad, total) {
  counters.innerHTML = `Всего: <span class="stat">{total}</span> · 
    <span class="stat ok">OK: ${ok}</span> · 
    <span class="stat bad">NOT FOUND: ${bad}</span>`;
}

function applyFilters() {
  const rows = Array.from(document.querySelectorAll('.row'));
  rows.forEach(row => {
    const path = row.dataset.path || '';
    const status = row.querySelector('.tag').textContent;
    const matchesQuery = !query || path.toLowerCase().includes(query.toLowerCase());
    const matchesMode = (filterMode === 'all') || (filterMode === 'bad' && status === 'NOT FOUND');
    row.style.display = matchesQuery && matchesMode ? 'contents' : 'none';
  });
}

document.getElementById('showAll').onclick = () => { filterMode = 'all'; applyFilters(); };
document.getElementById('showBad').onclick = () => { filterMode = 'bad'; applyFilters(); };
q.oninput = (e) => { query = e.target.value; applyFilters(); };

render(DATA);
</script>
</body>
</html>
