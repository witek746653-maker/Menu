<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EN Modal — Standalone Demo</title>
  <style>
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; margin: 24px; color: #37352f; }
    h2 { font-size: 20px; margin: 20px 0 8px; }
    h3 { font-size: 18px; font-weight: 700; display: inline-block; margin: 10px 0; }
    .note { margin: 10px 0 20px; font-size: 14px; color: #555; }

    /* --- EN modal block v3 (robust) --- */
    .en-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font: 600 12px/1 system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,.15);
      background: #fff;
      cursor: pointer;
      margin-left: .5rem;
      vertical-align: middle;
      box-shadow: 0 1px 2px rgba(0,0,0,.06);
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    }
    .en-chip:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(0,0,0,.12); }
    .en-chip:active { transform: translateY(0); }

    .en-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(2px);
      z-index: 9999; display: flex; align-items: flex-start; justify-content: center;
      overflow-y: auto; padding: 40px 16px;
    }
    .en-panel {
      display:flex; flex-direction:column;
      /* Reserve space for iOS home indicator and avoid footer cut-off */
      padding-bottom: calc(40px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, #ffffff 0%, #f9fbff 100%);
      border: 1px solid rgba(0, 86, 179, 0.12);
      border-radius: 16px;
      box-shadow: 0 14px 36px rgba(0,0,0,.25), 0 0 0 1px rgba(0, 86, 179, 0.04) inset;
      padding: 16px 20px; max-width: 720px; width: 100%;
      color:#0b234a; position: relative;
    }
    .en-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .en-title { font: 700 18px/1.2 system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; color: #082a63; }
    .en-actions { display: inline-flex; gap: 6px; align-items: center; }
    .en-btn { padding: 6px 10px; border-radius: 10px; font-weight: 600; border:1px solid rgba(0,0,0,.15); background: #f0f5ff; color: #06306b; cursor: pointer; }
    .en-btn:hover { background: #e6efff; }
    .en-close { background: #e74c3c; color: #fff; border: none; }
    .en-save { background: #2ecc71; color:#fff; border: none; }
    .en-cancel { background: #bdc3c7; border: none; }
    .en-sections { display: grid; gap: 10px; margin-top: 12px; flex:1 1 auto; overflow:auto;  }
    .en-sec { background: #ffffff; border: 1px solid rgba(0, 86, 179, 0.10); border-radius: 10px; padding: 8px 10px; }
    .en-label { font-weight: 650; color: #0f3c7d; margin-bottom: 4px; }
    .en-text { white-space: pre-wrap; }
    .en-editor { display: none; }
    .en-editing .en-text { display: none; }
    .en-editing .en-editor { display: block; }
    .en-editor textarea, .en-editor input {
      width: 100%; resize: vertical; border: 1px solid rgba(0,0,0,.2);
      border-radius: 8px; padding: 6px 8px; font: inherit; background: #fff;
    }
    .en-foot { display: none; justify-content: flex-end; gap: 8px; margin-top: 12px; position: sticky; bottom: 0; background: linear-gradient(180deg, rgba(249,251,255,0), #f9fbff 40%); padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid rgba(0,86,179,.08); }
    .en-editing .en-foot { display: flex; }
    @media (max-width: 600px){
      .en-panel {
      display:flex; flex-direction:column;
      /* Reserve space for iOS home indicator and avoid footer cut-off */
      padding-bottom: calc(40px + env(safe-area-inset-bottom)); padding: 12px 14px; border-radius: 14px; }
      .en-sections { gap: 8px; }
      .en-editor textarea { min-height: 72px; }
    }

    /* Audio chip inside title */
    .en-audio-under{display:block; margin-top:.4rem;}
    .en-audio-chip{display:inline-flex; align-items:center; gap:.35rem;
      padding:.2rem .55rem; border:1px solid rgba(0,0,0,.18); border-radius:999px; background:rgba(0,0,0,.06);
      font-size:.85rem; line-height:1; white-space:nowrap;}
    .en-audio-chip button{all:unset; cursor:pointer; padding:.1rem .4rem; border-radius:999px; border:1px solid rgba(0,0,0,.25); line-height:1;}
    .en-audio-chip button:active{transform:scale(.95);}
  
.en-title,
.en-text {
  word-wrap: break-word;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}


/* Mobile behavior: keep panel size, allow internal scroll, prevent background scroll bounce */
.en-backdrop { overscroll-behavior: contain; }
.en-sections { -webkit-overflow-scrolling: touch; }


/* Mobile edit lock */
.en-mobile-locked .en-editor { display: none !important; }
.en-mobile-locked .en-foot { display: none !important; }

</style>
</head>
<body>
  <h2>Демо раздела</h2>
  <p class="note">Кликни по кнопке <b>EN</b> рядом с заголовком блюда — откроется модалка перевода.</p>

  <h3>Говяжье ребро под соусом из черного перца</h3>
  <br/>
  <h3>Филе сибаса со шпинатом</h3>

  <script>
  (function(){
    const isMobile = window.innerWidth < 768 || /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);

    function slugify(str){
      const map={'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'zh','з':'z','и':'i','й':'y',
        'к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h',
        'ц':'ts','ч':'ch','ш':'sh','щ':'sch','ы':'y','э':'e','ю':'yu','я':'ya'};
      return (str||'').toLowerCase().replace(/[ъь]/g,'')
        .replace(/[\\u0400-\\u04FF]/g, ch => map[ch] ?? ch)
        .replace(/[^a-z0-9]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
    }
    const esc = s=>String(s??'').replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

    // Simple in-memory dict to avoid external en.json; keys are slugs from RU title
    const DEMO = {
      [slugify('Говяжье ребро под соусом из черного перца')]: {
        name: 'Beef rib with black pepper sauce',
        description: 'Slow-cooked beef rib, glazed with a bold black pepper reduction. Served with potato & sweet potato mix and chimichurri.',
        features: 'Contains black pepper. Ask guest about spiciness preference.',
        ingredients: 'Beef rib; black pepper sauce; potatoes; sweet potatoes; chimichurri.'
      },
      [slugify('Филе сибаса со шпинатом')]: {
        name: 'Seabass fillet with spinach',
        description: 'Tender seabass, silky herb mash, bright citrus beurre blanc.',
        features: 'Citrus; dairy in sauce.',
        ingredients: 'Seabass; spinach; mashed potatoes; citrus butter sauce.'
      }
    };

    
    function renderSectionsHTML(data){
      const fields=[
        {key:'name', label:'Name', single:true},
        {key:'description', label:'Description'},
        {key:'features', label:'Features'},
        {key:'ingredients', label:'Ingredients'}
      ];
      let html='';
      fields.forEach(f=>{
        const val = data[f.key] || '';
        // On mobile, still hide empty sections for readability
        if (isMobile && !val) return;
        html += '<div class="en-sec">'
              + '<div class="en-label">' + esc(f.label) + '</div>'
              + '<div class="en-text">' + esc(val) + '</div>'
              + '<div class="en-editor">'
              +   (f.single
                    ? '<input class="en-'+f.key+'" value="'+esc(val)+'"/>'
                    : '<textarea class="en-'+f.key+'" rows="3">'+esc(val)+'</textarea>')
              + '</div>'
              + '</div>';
      });
      return html;
    }
    

    
    
    
    
    function openPanel(slug, ruName, data, dict){
      const backdrop = document.createElement('div');
      backdrop.className='en-backdrop';
      const panel = document.createElement('div');
      panel.className='en-panel';

      // Header actions: always show Edit button (desktop + mobile)
      panel.innerHTML=`
        <div class="en-head">
          <div class="en-title">${esc(data.name||ruName)}</div>
          <div class="en-actions">
            <button class="en-btn en-edit" type="button">✎ Edit</button>
            <button class="en-btn en-close" type="button">✕</button>
          </div>
        </div>
        <div class="en-sections">${renderSectionsHTML(data)}</div>
        <div class="en-foot">
          <button class="en-btn en-save" type="button">Save</button>
          <button class="en-btn en-cancel" type="button">Cancel</button>
        </div>
      `;

      backdrop.appendChild(panel);
      document.body.appendChild(backdrop);

      const headEl = panel.querySelector('.en-head');
      const bodyEl = panel.querySelector('.en-sections');
      const footEl = panel.querySelector('.en-foot');

      // If mobile, lock editing initially
      if (isMobile) panel.classList.add('en-mobile-locked');

      // Prevent background scroll
      const prevHtmlOverflow = document.documentElement.style.overflow;
      const prevBodyOverflow = document.body.style.overflow;
      document.documentElement.style.overflow = 'hidden';
      document.body.style.overflow = 'hidden';

      function lockInitialSizeDesktop(){
        if (!panel.style.width) panel.style.width = '720px';
        if (!panel.style.maxWidth) panel.style.maxWidth = '90vw';
        if (!panel.style.height) panel.style.height = '70vh';
        const r = panel.getBoundingClientRect();
        panel.style.width = Math.round(r.width) + 'px';
        panel.style.height = Math.round(r.height) + 'px';
        panel.style.maxWidth = 'none';
        panel.style.maxHeight = 'none';
        panel.style.overflow = 'hidden';
      }

      function lockInitialSizeMobile(){
        const vv = window.visualViewport;
        const scale = (vv && vv.scale) || 1;
        const w = vv ? vv.width : window.innerWidth;
        const h = vv ? vv.height : window.innerHeight;
        const targetW = Math.max(280, Math.floor(w * 0.70));
        const targetH = Math.max(220, Math.floor(h * 0.70));
        panel.style.transformOrigin = 'top left';
        panel.style.transform = 'scale(' + (1 / scale) + ')';
        panel.style.boxSizing = 'border-box';
        panel.style.width = Math.floor(targetW * scale) + 'px';
        panel.style.height = Math.floor(targetH * scale) + 'px';
        panel.style.maxWidth = 'none';
        panel.style.maxHeight = 'none';
        panel.style.overflow = 'hidden';
        const ox = vv ? vv.offsetLeft : 0;
        const oy = vv ? vv.offsetTop : 0;
        panel.style.position = 'fixed';
        panel.style.left = (ox + (w - targetW) / 2) + 'px';
        panel.style.top  = (oy + (h - targetH) / 2) + 'px';
      }

      function layoutContentDesktop(){
        const headH = headEl ? headEl.getBoundingClientRect().height : 0;
        const footH = (panel.classList.contains('en-editing') && footEl) ? footEl.getBoundingClientRect().height : 0;
        const ph = panel.getBoundingClientRect().height;
        const avail = Math.max(80, ph - headH - footH - 24);
        bodyEl.style.maxHeight = Math.floor(avail) + 'px';

        const floor = 12;
        let fs = parseFloat(getComputedStyle(panel).fontSize) || 14;
        let guard = 0;
        function tooTall(){ return bodyEl.scrollHeight > bodyEl.clientHeight + 1; }
        while (tooTall() && fs > floor && guard < 20){
          fs -= 1; panel.style.fontSize = fs + 'px'; guard++;
        }
        bodyEl.style.overflow = tooTall() ? 'auto' : 'hidden';
      }

      function layoutContentMobile(){
        const headH = headEl ? headEl.getBoundingClientRect().height : 0;
        const footH = (panel.classList.contains('en-editing') && footEl) ? footEl.getBoundingClientRect().height : 0;
        const ph = panel.getBoundingClientRect().height;
        const avail = Math.max(80, ph - headH - footH - 20);
        bodyEl.style.maxHeight = Math.floor(avail) + 'px';
        bodyEl.style.overflow = (bodyEl.scrollHeight > bodyEl.clientHeight + 1) ? 'auto' : 'hidden';
      }

      if (isMobile) lockInitialSizeMobile(); else lockInitialSizeDesktop();
      requestAnimationFrame(()=>{
        if (isMobile) { layoutContentMobile(); setTimeout(layoutContentMobile, 50); }
        else { layoutContentDesktop(); setTimeout(layoutContentDesktop, 50); }
      });

      function relayoutOnly(){
        if (isMobile) layoutContentMobile(); else layoutContentDesktop();
      }
      const vv = window.visualViewport;
      if (vv){
        vv.addEventListener('resize', relayoutOnly);
        vv.addEventListener('scroll', relayoutOnly);
      }
      window.addEventListener('orientationchange', relayoutOnly);
      window.addEventListener('resize', relayoutOnly);

      backdrop.addEventListener('click',e=>{ if(e.target===backdrop) backdrop.remove(); });
      panel.querySelector('.en-close').addEventListener('click',()=>backdrop.remove());

      const editBtn=panel.querySelector('.en-edit');
      const saveBtn=panel.querySelector('.en-save');
      const cancelBtn=panel.querySelector('.en-cancel');

      // Password gate for mobile: only 'roma' unlocks editing
      editBtn?.addEventListener('click',()=>{
        if (isMobile && panel.classList.contains('en-mobile-locked')){
          const pass = (window.prompt('Enter editor code') || '').trim().toLowerCase();
          if (pass !== 'roma'){ alert('Wrong code'); return; }
          panel.classList.remove('en-mobile-locked');
        }
        panel.classList.add('en-editing');
        relayoutOnly();
        setTimeout(relayoutOnly, 0);
      });

      cancelBtn?.addEventListener('click',()=>{
        panel.classList.remove('en-editing');
        relayoutOnly();
        setTimeout(relayoutOnly, 0);
      });

      saveBtn?.addEventListener('click', async ()=>{
        const updated={
          name: panel.querySelector('.en-name')?.value?.trim() || '',
          description: panel.querySelector('.en-description')?.value?.trim() || '',
          features: panel.querySelector('.en-features')?.value?.trim() || '',
          ingredients: panel.querySelector('.en-ingredients')?.value?.trim() || '',
        };
        dict[slug]=updated;
        panel.classList.remove('en-editing');
        panel.querySelector('.en-title').textContent = updated.name || ruName;
        panel.querySelector('.en-sections').innerHTML = renderSectionsHTML(updated);
        relayoutOnly();
        setTimeout(relayoutOnly, 0);
      });

      // Inject audio chip under title (TTS for demo)
      (function attach(head){
        if(!head) return;
        const title=head.querySelector('.en-title');
        if(!title || title.__enAudioChip) return;
        const text=(title.childNodes[0]?.textContent || title.textContent || '').trim();
        const under=document.createElement('div');
        under.className='en-audio-under';
        const chip=document.createElement('span');
        chip.className='en-audio-chip';
        chip.innerHTML='<span>EN audio</span> <button type="button">🔊</button>';
        under.appendChild(chip);
        title.appendChild(under);
        chip.querySelector('button').addEventListener('click',()=>{
          try{ const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; (window.speechSynthesis||{}).speak?.(u); }catch(e){}
        });
        title.__enAudioChip=chip;
      })(panel.querySelector('.en-head'));

      // Cleanup listeners when closed + restore scroll
      const mo = new MutationObserver(()=>{
        if (!document.body.contains(backdrop)){
          try{
            if (vv){ vv.removeEventListener('resize', relayoutOnly); vv.removeEventListener('scroll', relayoutOnly); }
            window.removeEventListener('orientationchange', relayoutOnly);
            window.removeEventListener('resize', relayoutOnly);
          }catch(e){}
          document.documentElement.style.overflow = prevHtmlOverflow;
          document.body.style.overflow = prevBodyOverflow;
          mo.disconnect();
        }
      });
      mo.observe(document.body, {childList:true, subtree:true});
    }


    function getRuTitleFromH3(h3){
      const clone = h3.cloneNode(true);
      clone.querySelectorAll('.en-chip').forEach(b=>b.remove());
      return clone.textContent.trim();
    }

    function ensureChips(){
      document.querySelectorAll('h3').forEach(h3=>{
        if (!h3.querySelector('.en-chip')) {
          const b=document.createElement('button');
          b.className='en-chip'; b.type='button'; b.textContent='EN';
          h3.appendChild(b);
        }
      });
    }

    function bindChips(){
      document.querySelectorAll('h3 .en-chip').forEach(btn=>{
        btn.onclick = async ()=>{
          const h3 = btn.closest('h3');
          const ruName = getRuTitleFromH3(h3);
          const slug = slugify(ruName);
          const dict = Object.assign({}, DEMO); // local store per open
          const tr = dict[slug] || {name:'',description:'',features:'',ingredients:''};
          openPanel(slug, ruName, tr, dict);
        };
      });
    }

    if (document.readyState === 'loading'){
      document.addEventListener('DOMContentLoaded', ()=>{ ensureChips(); bindChips(); });
    } else {
      ensureChips(); bindChips();
    }
  })();
  </script>
</body>
</html>
