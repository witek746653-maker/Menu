const tbody = document.querySelector('#tbl tbody');
function render(init=false){
  tbody.innerHTML = '';
  rows.forEach((r,i)=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${i+1}</td>
      <td><code>${r.original_src_in_fixed_html}</code></td>
      <td><code>${r.filename}</code></td>
      <td>${r.guessed_folder}</td>
      <td><code>${r.guessed_path}</code></td>
      <td class="status">${r.exists ? '<span class="ok">OK</span>' : (init ? '' : '<span class="miss">NO</span>')}</td>
      <td class="url"><code>${r.resolved_url || ''}</code></td>
    `;
    tbody.appendChild(tr);
  });
}
render(true);

async function head(url){
  try{
    const r = await fetch(url, {method:'HEAD', cache:'no-store'});
    return r.ok;
  }catch(e){
    return false;
  }
}

function unique(arr){ return Array.from(new Set(arr)); }

function candidates(r){
  const f = r.filename;
  const tries = [
    r.original_src_in_fixed_html,
    r.guessed_path,
    './' + r.guessed_path,
    'images/' + f,
    'icons/' + f,
    './images/' + f,
    './icons/' + f,
    f
  ];
  const dot = f.lastIndexOf('.');
  if (dot>0){
    const name = f.slice(0,dot), ext = f.slice(dot+1);
    const variants = unique([ext.toLowerCase(), ext.toUpperCase(), ext[0].toUpperCase()+ext.slice(1).toLowerCase()]);
    variants.forEach(e => {
      tries.push('images/' + name + '.' + e);
      tries.push('icons/' + name + '.' + e);
    });
  }
  return unique(tries);
}

async function run(){
  for (let i=0;i<rows.length;i++){
    const r = rows[i];
    const tries = candidates(r);
    r.exists = false;
    r.resolved_url = '';
    for (const u of tries){
      const ok = await head(u);
      if (ok){ r.exists = true; r.resolved_url = u; break; }
    }
    render();
  }
  const csv = ['original_src_in_fixed_html,filename,guessed_folder,guessed_path,exists,resolved_url']
    .concat(rows.map(r=>[r.original_src_in_fixed_html, r.filename, r.guessed_folder, r.guessed_path, r.exists, r.resolved_url].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')))
    .join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const dl = document.getElementById('download');
  dl.href = url; dl.download = 'image_existence_report.csv'; dl.style.pointerEvents='auto'; dl.style.opacity='1';
}

document.getElementById('run').addEventListener('click', run);
</script>
