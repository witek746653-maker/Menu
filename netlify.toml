# Netlify конфигурация для монорепо
# Этот файл настраивает деплой фронтенда из директории frontend/
# Конфигурация применяется только для ветки second-branch

# Настройки для ветки second-branch
# Это гарантирует, что деплой будет работать только для этой ветки
# и не повлияет на поведение main branch
[context.second-branch]
  # Базовая директория - указываем, где находится фронтенд в монорепо
  base = "frontend"
  
  # Команда для установки зависимостей и сборки
  # npm ci быстрее и надежнее для CI/CD, использует package-lock.json
  command = "npm ci && npm run build"
  
  # Директория с собранными файлами (относительно base directory)
  # Create React App по умолчанию собирает проект в папку build/
  publish = "build"

# Правила редиректов для client-side routing
# React Router использует BrowserRouter, поэтому все запросы должны идти на index.html
# Это позволяет React приложению обрабатывать маршруты на клиенте
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

